<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mon Patrimoine - Private Wealth</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-dark: #080E1A;
    --bg-card-dark: rgba(15, 23, 42, 0.6);
    --gold: #D4AF37; /* Or noble */
    --gold-light: #F4EBD6; /* Champagne */
    --text-light: #CBD5E1;
    --red: #E11D48;
    --shadow-3d: 0 30px 60px -15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    --glow: 0 0 20px rgba(212, 175, 55, 0.25); /* Halo lumineux */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

  /* --- ECRAN DE CONNEXION --- */
  .login-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: var(--bg-card-dark); backdrop-filter: blur(16px);
    border: 1px solid rgba(212, 175, 55, 0.3); padding: 50px 30px;
    border-radius: 20px; width: 100%; max-width: 400px; text-align: center;
    box-shadow: var(--shadow-3d), var(--glow);
  }
  .login-card h1 { font-size: 2.2rem; color: #fff; margin-bottom: 5px; }
  .login-card p { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 30px; text-shadow: var(--glow);}
  .login-input {
    width: 100%; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #fff; text-align: center; font-size: 1.2rem; letter-spacing: 0.2em; margin-bottom: 20px;
    outline: none; transition: border 0.3s;
  }
  .login-input:focus { border-color: var(--gold); box-shadow: var(--glow);}
  .btn-gold {
    width: 100%; padding: 15px; background: linear-gradient(135deg, #D4AF37, #A6833C);
    color: #0F172A; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem;
    cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: transform 0.2s;
  }
  .btn-gold:active { transform: scale(0.98); }
  
  /* --- APPLICATION LAYOUT --- */
  .app-container { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px 20px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 25px 0; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px;}
  .header h2 { font-size: 1.8rem; color: #fff; }
  .btn-logout { background: none; border: none; color: #64748B; font-size: 0.8rem; text-decoration: underline; cursor: pointer; }

  /* --- CARTES 3D PREMIUM --- */
  .card { 
    background: var(--bg-card-dark); backdrop-filter: blur(16px);
    border-radius: 16px; padding: 25px; box-shadow: var(--shadow-3d);
    border: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px;
    transition: transform 0.2s;
  }
  .card-header { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; font-weight: 600;}
  
  .total-amount { 
    font-size: 3.2rem; font-family: 'Playfair Display', serif; font-weight: 600; color: var(--gold-light); 
    line-height: 1.1; text-shadow: var(--glow);
  }

  /* Graphique */
  .chart-container { position: relative; height: 250px; width: 100%; margin-top: 15px; }

  /* Formulaire de saisie */
  .input-group { 
    display: flex; justify-content: space-between; align-items: center; 
    background: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: 12px; 
    margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
  }
  .input-label p:first-child { font-weight: 600; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
  .input-label p:last-child { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
  .input-field {
    width: 120px; padding: 12px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3);
    text-align: right; font-weight: 600; font-size: 1rem; color: var(--gold-light);
    background: rgba(0,0,0,0.2); outline: none; transition: border 0.3s;
  }
  .input-field:focus { border-color: var(--gold); box-shadow: var(--glow);}

  /* Navigation basse */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
    background: rgba(8, 14, 26, 0.9); backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; gap: 50px;
    align-items: center; z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: none; cursor: pointer; color: #475569; transition: color 0.3s;
  }
  .nav-item.active { color: var(--gold); text-shadow: var(--glow);}
  .nav-icon { font-size: 1.4rem; }
  .nav-text { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;}

  .error-msg { color: var(--red); font-size: 0.8rem; margin-bottom: 15px; text-align: center; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // --- CONFIGURATION ---
  const SUPABASE_URL = 'https://geykxuqyspwzocvwzqjj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AsJvkk-erLkE5-pUbxiNnw_h2mmuuRN';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Données de ton Excel
  const EXCEL_DATA = [
    { owner: 'Aubin', envelope: 'Compte Courant / Livret', account_name: 'Compte courant TR', category: '', value_eur: 15000, is_liability: false },
    { owner: 'Aubin', envelope: 'PEA', account_name: 'ETF actions', category: 'Actions', value_eur: 248567, is_liability: false },
    { owner: 'Aubin', envelope: 'PEA-PME', account_name: 'Fonds IE Europe small', category: 'Actions', value_eur: 2800, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Linxea Spirit 2', category: 'Actions', value_eur: 22650, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Linxea Spirit 2', category: 'Fonds euros', value_eur: 1890, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Linxea Spirit 2', category: 'SCPI', value_eur: 76400, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Linxea Spirit 2', category: 'Private equity', value_eur: 10850, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Linxea Spirit 2', category: 'Fonds diversifiés', value_eur: 1450, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Ramify', category: 'Actions', value_eur: 8970, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Ramify', category: 'Fonds euros', value_eur: 1850, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Ramify', category: 'SCPI', value_eur: 1670, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Ramify', category: 'Private equity', value_eur: 2220, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Ramify', category: 'Obligataire', value_eur: 1970, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'CNP Lucya', category: 'Actions', value_eur: 6200, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'CNP Lucya', category: 'Fonds euros', value_eur: 4000, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Louve infinity', category: 'Actions', value_eur: 6500, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Louve infinity', category: 'Fonds euros', value_eur: 950, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Louve infinity', category: 'SCPI', value_eur: 2700, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Corum life', category: 'Fonds euros', value_eur: 2700, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Corum life', category: 'SCPI', value_eur: 5500, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Corum life', category: 'Obligataire', value_eur: 2200, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Boursobank', category: 'Fonds euros', value_eur: 8100, is_liability: false },
    { owner: 'Aubin', envelope: 'Assurance-Vie', account_name: 'Fortuneo', category: 'Fonds euros', value_eur: 2000, is_liability: false },
    { owner: 'Aubin', envelope: 'CTO 1', account_name: 'MEXEM', category: '', value_eur: 14500, is_liability: false },
    { owner: 'Aubin', envelope: 'CTO 2', account_name: 'TRADE REPUBLIC', category: '', value_eur: 1500, is_liability: false },
    { owner: 'Aubin', envelope: 'EI à l\'IS', account_name: 'Trésorerie Professionnelle', category: '', value_eur: 15000, is_liability: false },
    { owner: 'Aubin', envelope: 'EI à l\'IS', account_name: 'Usufruit de SCPI', category: 'SCPI', value_eur: 56000, is_liability: false },
    { owner: 'Aubin', envelope: 'Crédit Personnel', account_name: 'Prêt Conso Personnel', category: '', value_eur: -20288, is_liability: true },
    { owner: 'Aubin', envelope: 'Immobilier', account_name: 'Résidence Principale', category: 'RP', value_eur: 290000, is_liability: false },
    { owner: 'Aubin', envelope: 'Immobilier', account_name: 'Crédit RP', category: 'RP', value_eur: -208525, is_liability: true },
    { owner: 'Aubin', envelope: 'PER', account_name: 'Ramify + linxea spirit + CA', category: '', value_eur: 14100, is_liability: false },
    { owner: 'Oliwia', envelope: 'Compte Courant/Livret', account_name: 'LCL', category: '', value_eur: 23750, is_liability: false },
    { owner: 'Oliwia', envelope: 'Compte Bancaire Polonais', account_name: 'PKO / mBank', category: '', value_eur: 6575, is_liability: false },
    { owner: 'Oliwia', envelope: 'Compte courant', account_name: 'Revolut', category: '', value_eur: 774, is_liability: false },
    { owner: 'Oliwia', envelope: 'PEA', account_name: 'Fortuneo', category: 'Actions', value_eur: 13000, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Linxea spirit 2', category: 'Actions', value_eur: 1175, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Linxea spirit 2', category: 'Fonds euros', value_eur: 1850, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Linxea spirit 2', category: 'SCPI', value_eur: 2260, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Fortuneo', category: 'Fonds euros', value_eur: 2000, is_liability: false },
    { owner: 'Oliwia', envelope: 'PEE', account_name: 'CIC', category: '', value_eur: 9687, is_liability: false }
  ];

  function App() {
      const [session, setSession] = useState(null);
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      
      const [positions, setPositions] = useState([]);
      const [view, setView] = useState('dashboard');
      const [formValues, setFormValues] = useState({});
      const chartRef = useRef(null);

      useEffect(() => {
          supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
      }, []);

      useEffect(() => {
          if (session) fetchPositions();
      }, [session]);

      useEffect(() => {
          if (view === 'dashboard' && positions.length > 0 && chartRef.current) {
              const ctx = chartRef.current.getContext('2d');
              const existingChart = Chart.getChart(ctx.canvas);
              if (existingChart) existingChart.destroy();

              const byCategory = {};
              positions.forEach(p => {
                  if(p.value_eur > 0) {
                      const cat = p.category || p.envelope;
                      byCategory[cat] = (byCategory[cat] || 0) + p.value_eur;
                  }
              });

              // Palette de couleurs basée sur la nouvelle DA (Or, Bleu Nuit, Sable)
              const colors = ['#D4AF37', '#3B82F6', '#10B981', '#E11D48', '#8B5CF6', '#64748B', '#F59E0B'];

              new Chart(ctx, {
                  type: 'doughnut',
                  data: {
                      labels: Object.keys(byCategory),
                      datasets: [{
                          data: Object.values(byCategory),
                          backgroundColor: colors,
                          borderWidth: 2,
                          borderColor: '#0F172A',
                          hoverOffset: 4
                      }]
                  },
                  options: {
                      responsive: true,
                      maintainAspectRatio: false,
                      cutout: '75%',
                      plugins: {
                          legend: { 
                              position: 'bottom', 
                              labels: { 
                                  boxWidth: 10, 
                                  padding: 20,
                                  font: { family: 'Inter', size: 11 },
                                  color: '#CBD5E1'
                              } 
                          },
                          tooltip: {
                              callbacks: {
                                  label: function(context) {
                                      let label = context.label || '';
                                      if (label) label += ' : ';
                                      label += new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(context.raw);
                                      return label;
                                  }
                              }
                          }
                      }
                  }
              });
          }
      }, [view, positions]);

      async function fetchPositions() {
          setLoading(true);
          const { data, error } = await supabase.from('positions').select('*').order('date', { ascending: false });
          
          if (error) {
              console.error(error);
          } else if (data && data.length > 0) {
              const latest = [];
              const seen = new Set();
              data.forEach(p => {
                  const key = `${p.owner}-${p.envelope}-${p.account_name}-${p.category}`;
                  if (!seen.has(key)) {
                      seen.add(key);
                      latest.push(p);
                  }
              });
              setPositions(latest);
              
              const initialForm = {};
              latest.forEach(p => initialForm[p.id] = p.value_eur);
              setFormValues(initialForm);
          }
          setLoading(false);
      }

      async function handleSeedDatabase() {
          setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          const dataToInsert = EXCEL_DATA.map(p => ({ ...p, date: today }));
          
          const { error } = await supabase.from('positions').insert(dataToInsert);
          
          if (error) {
              alert("Erreur : " + error.message);
          } else {
              alert("Base initialisée avec succès !");
              fetchPositions();
          }
          setLoading(false);
      }

      async function handleLogin(e) {
          e.preventDefault();
          setLoading(true);
          setError('');
          const { error } = await supabase.auth.signInWithPassword({
              email: 'admin@patrimoine.app',
              password: password
          });
          if (error) setError('Mot de passe incorrect');
          setLoading(false);
      }

      async function handleLogout() {
          await supabase.auth.signOut();
          setSession(null);
      }

      async function handleSave(e) {
          e.preventDefault();
          setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          
          const newPositions = Object.keys(formValues).map(id => {
              const original = positions.find(p => p.id === id);
              return {
                  date: today,
                  owner: original.owner,
                  envelope: original.envelope,
                  account_name: original.account_name,
                  category: original.category,
                  value_eur: parseFloat(formValues[id]),
                  is_liability: original.is_liability
              };
          });

          const { error } = await supabase.from('positions').insert(newPositions);
          
          if (error) {
              alert("Erreur : " + error.message);
          } else {
              alert("Mise à jour enregistrée !");
              setView('dashboard');
              fetchPositions();
          }
          setLoading(false);
      }

      if (!session) {
          return (
              <div className="login-screen">
                  <form onSubmit={handleLogin} className="login-card">
                      <h1 className="serif">Patrimoine</h1>
                      <p>Private Wealth</p>
                      {error && <p className="error-msg">{error}</p>}
                      <input 
                          type="password" 
                          placeholder="••••••••" 
                          value={password}
                          onChange={e => setPassword(e.target.value)}
                          className="login-input"
                      />
                      <button type="submit" disabled={loading} className="btn-gold">
                          {loading ? "Connexion..." : "Accéder au portefeuille"}
                      </button>
                  </form>
              </div>
          );
      }

      const totalNet = positions.reduce((sum, p) => sum + p.value_eur, 0);
      const hasData = positions.length > 0;

      return (
          <div className="app-container">
              <header className="header">
                  <h2 className="serif">Mon Patrimoine</h2>
                  <button onClick={handleLogout} className="btn-logout">Déconnexion</button>
              </header>

              <main>
                  {view === 'dashboard' ? (
                      <div>
                          <div className="card" style={{borderBottom: '3px solid var(--gold)'}}>
                              <div className="card-header">Patrimoine Net Total</div>
                              <div className="total-amount">
                                  {hasData 
                                    ? totalNet.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })
                                    : "0 €"}
                              </div>
                          </div>

                          {hasData ? (
                              <div className="card">
                                  <div className="card-header" style={{textAlign: 'center'}}>Allocation d'Actifs</div>
                                  <div className="chart-container">
                                      <canvas ref={chartRef}></canvas>
                                  </div>
                              </div>
                          ) : (
                              <div className="card" style={{textAlign: 'center', padding: '40px 20px'}}>
                                  <p style={{color: 'var(--text-light)', marginBottom: '20px', lineHeight: '1.6'}}>
                                      Ta base de données est prête, mais elle est vide. Clique sur le bouton ci-dessous pour injecter tes données Excel actuelles et démarrer !
                                  </p>
                                  <button onClick={handleSeedDatabase} disabled={loading} className="btn-gold">
                                      {loading ? "Initialisation..." : "Initialiser avec mon Excel"}
                                  </button>
                              </div>
                          )}
                      </div>
                  ) : (
                      <form onSubmit={handleSave}>
                          <p style={{fontSize: '0.85rem', color: 'var(--text-light)', marginBottom: '20px', lineHeight: '1.6'}}>
                              Mets à jour tes valeurs. L'enregistrement créera un nouvel historique.
                          </p>
                          
                          {positions.map(p => (
                              <div key={p.id} className="input-group">
                                  <div className="input-label">
                                      <p>{p.account_name}</p>
                                      <p>{p.owner} • {p.category || p.envelope}</p>
                                  </div>
                                  <input 
                                      type="number" 
                                      value={formValues[p.id] || ''}
                                      onChange={e => setFormValues({...formValues, [p.id]: e.target.value})}
                                      className="input-field"
                                  />
                              </div>
                          ))}
                          
                          {hasData && (
                              <button type="submit" disabled={loading} className="btn-gold" style={{marginTop: '30px'}}>
                                  {loading ? "Enregistrement..." : "Enregistrer la mise à jour"}
                              </button>
                          )}
                      </form>
                  )}
              </main>

              <nav className="bottom-nav">
                  <button onClick={() => setView('dashboard')} className={`nav-item ${view === 'dashboard' ? 'active' : ''}`}>
                      <span className="nav-icon">📊</span>
                      <span className="nav-text">Tableau de bord</span>
                  </button>
                  <button onClick={() => setView('saisie')} className={`nav-item ${view === 'saisie' ? 'active' : ''}`}>
                      <span className="nav-icon">✏️</span>
                      <span className="nav-text">Mise à jour</span>
                  </button>
              </nav>
          </div>
      );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
