<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mon Patrimoine - Private Wealth</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-dark: #080E1A;
    --bg-card-dark: rgba(15, 23, 42, 0.6);
    --gold: #D4AF37;
    --gold-light: #F4EBD6;
    --text-light: #CBD5E1;
    --red: #E11D48;
    --blue: #3B82F6;
    --green: #10B981;
    --shadow-3d: 0 30px 60px -15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    --glow: 0 0 20px rgba(212, 175, 55, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

  /* --- ECRAN DE CONNEXION --- */
  .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--bg-card-dark); backdrop-filter: blur(16px);
    border: 1px solid rgba(212, 175, 55, 0.3); padding: 50px 30px;
    border-radius: 20px; width: 100%; max-width: 400px; text-align: center;
    box-shadow: var(--shadow-3d), var(--glow);
  }
  .login-card h1 { font-size: 2.2rem; color: #fff; margin-bottom: 5px; }
  .login-card p { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 30px; text-shadow: var(--glow);}
  .login-input {
    width: 100%; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #fff; text-align: center; font-size: 1.2rem; letter-spacing: 0.2em; margin-bottom: 20px;
    outline: none; transition: border 0.3s;
  }
  .login-input:focus { border-color: var(--gold); box-shadow: var(--glow);}
  .btn-gold {
    width: 100%; padding: 15px; background: linear-gradient(135deg, #D4AF37, #A6833C);
    color: #0F172A; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem;
    cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: transform 0.2s;
  }
  .btn-gold:active { transform: scale(0.98); }
  
  /* --- APPLICATION LAYOUT --- */
  .app-container { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px 20px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 25px 0; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px;}
  .header h2 { font-size: 1.8rem; color: #fff; }
  .btn-logout { background: none; border: none; color: #64748B; font-size: 0.8rem; text-decoration: underline; cursor: pointer; }

  /* Filtre Propriétaire */
  .owner-filter {
    display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
  }
  .owner-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #94A3B8; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
  }
  .owner-btn.active {
    background: var(--gold); color: #0F172A; border-color: var(--gold); box-shadow: var(--glow);
  }

  /* --- CARTES 3D PREMIUM --- */
  .card { 
    background: var(--bg-card-dark); backdrop-filter: blur(16px);
    border-radius: 16px; padding: 25px; box-shadow: var(--shadow-3d);
    border: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px;
  }
  .card-header { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; font-weight: 600;}
  
  .total-amount { 
    font-size: 3.2rem; font-family: 'Playfair Display', serif; font-weight: 600; color: var(--gold-light); 
    line-height: 1.1; text-shadow: var(--glow);
  }

  /* Graphiques */
  .chart-container { position: relative; height: 220px; width: 100%; margin-top: 15px; }
  .chart-container-small { position: relative; height: 150px; width: 100%; margin-top: 10px; }

  /* Barres de progression Enveloppes */
  .envelope-row { margin-bottom: 15px; }
  .envelope-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-light); }
  .envelope-bar-bg { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
  .envelope-bar-fill { height: 100%; background: linear-gradient(90deg, #D4AF37, #F4EBD6); border-radius: 4px; }

  /* Formulaire */
  .input-group { 
    display: flex; justify-content: space-between; align-items: center; 
    background: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: 12px; 
    margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
  }
  .input-label p:first-child { font-weight: 600; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
  .input-label p:last-child { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
  .input-field {
    width: 120px; padding: 12px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3);
    text-align: right; font-weight: 600; font-size: 1rem; color: var(--gold-light);
    background: rgba(0,0,0,0.2); outline: none; transition: border 0.3s;
  }
  .input-field:focus { border-color: var(--gold); box-shadow: var(--glow);}

  /* Navigation basse */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
    background: rgba(8, 14, 26, 0.9); backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; gap: 50px;
    align-items: center; z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: none; cursor: pointer; color: #475569; transition: color 0.3s;
  }
  .nav-item.active { color: var(--gold); text-shadow: var(--glow);}
  .nav-icon { font-size: 1.4rem; }
  .nav-text { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;}

  .error-msg { color: var(--red); font-size: 0.8rem; margin-bottom: 15px; text-align: center; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

</head>

  const EXCEL_DATA = [

    { owner: 'Aubin', envelope: 'Entreprise', account_name: 'Trésorerie Pro', category: 'Livrets', value_eur: 15000, is_liability: false },
    { owner: 'Aubin', envelope: 'Entreprise', account_name: 'Usufruit de SCPI', category: 'SCPI', value_eur: 56000, is_liability: false },
    { owner: 'Aubin', envelope: 'Crédit', account_name: 'Prêt Conso', category: 'Dettes', value_eur: -20288, is_liability: true },
    { owner: 'Aubin', envelope: 'Immobilier', account_name: 'Résidence Principale', category: 'Immobilier', value_eur: 290000, is_liability: false },
    { owner: 'Aubin', envelope: 'Immobilier', account_name: 'Crédit RP', category: 'Dettes', value_eur: -208525, is_liability: true },
    { owner: 'Aubin', envelope: 'PER', account_name: 'PER', category: 'Actions', value_eur: 14100, is_liability: false },
    { owner: 'Oliwia', envelope: 'Compte Courant', account_name: 'LCL', category: 'Livrets', value_eur: 23750, is_liability: false },
    { owner: 'Oliwia', envelope: 'Compte Bancaire', account_name: 'PKO / mBank', category: 'Livrets', value_eur: 6575, is_liability: false },
    { owner: 'Oliwia', envelope: 'Compte Courant', account_name: 'Revolut', category: 'Livrets', value_eur: 774, is_liability: false },
    { owner: 'Oliwia', envelope: 'PEA', account_name: 'Fortuneo', category: 'Actions', value_eur: 13000, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Linxea spirit 2', category: 'Actions', value_eur: 1175, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Linxea spirit 2', category: 'Fonds euros', value_eur: 1850, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Linxea spirit 2', category: 'SCPI', value_eur: 2260, is_liability: false },
    { owner: 'Oliwia', envelope: 'Assurance-Vie', account_name: 'Fortuneo', category: 'Fonds euros', value_eur: 2000, is_liability: false },
    { owner: 'Oliwia', envelope: 'PEE', account_name: 'CIC', category: 'Actions', value_eur: 9687, is_liability: false }
  ];

  function App() {
      const [session, setSession] = useState(null);
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      
      const [positions, setPositions] = useState([]);
      const [view, setView] = useState('dashboard');
      const [ownerFilter, setOwnerFilter] = useState('Tous'); // 'Tous', 'Aubin', 'Oliwia'
      const [formValues, setFormValues] = useState({});
      
      const categoryChartRef = useRef(null);
      const ownerChartRef = useRef(null);

      useEffect(() => {
          supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
      }, []);

      useEffect(() => {
          if (session) fetchPositions();
      }, [session]);

      // Filtrer les données selon le propriétaire sélectionné
      const filteredPositions = positions.filter(p => ownerFilter === 'Tous' || p.owner === ownerFilter);

      useEffect(() => {
          if (view === 'dashboard' && filteredPositions.length > 0) {
              renderCharts();
          }
      }, [view, filteredPositions]);

      function renderCharts() {
          // 1. Graphique Catégories
          const byCategory = {};
          filteredPositions.forEach(p => {
              if(p.value_eur > 0) {
                  byCategory[p.category] = (byCategory[p.category] || 0) + p.value_eur;
              }
          });

          if (categoryChartRef.current) {
              const ctx = categoryChartRef.current.getContext('2d');
              const existing = Chart.getChart(ctx.canvas);
              if (existing) existing.destroy();

              new Chart(ctx, {
                  type: 'doughnut',
                  data: {
                      labels: Object.keys(byCategory),
                      datasets: [{
                          data: Object.values(byCategory),
                          backgroundColor: ['#D4AF37', '#3B82F6', '#10B981', '#E11D48', '#8B5CF6', '#64748B', '#F59E0B'],
                          borderWidth: 2,
                          borderColor: '#0F172A'
                      }]
                  },
                  options: {
                      responsive: true, maintainAspectRatio: false, cutout: '75%',
                      plugins: {
                          legend: { position: 'right', labels: { boxWidth: 10, color: '#CBD5E1', font: {size: 10} } }
                      }
                  }
              });
          }

          // 2. Graphique Propriétaires (on ne l'affiche que si le filtre est sur "Tous")
          if (ownerChartRef.current && ownerFilter === 'Tous') {
              const byOwner = {};
              positions.forEach(p => {
                  byOwner[p.owner] = (byOwner[p.owner] || 0) + p.value_eur;
              });

              const ctx = ownerChartRef.current.getContext('2d');
              const existing = Chart.getChart(ctx.canvas);
              if (existing) existing.destroy();

              new Chart(ctx, {
                  type: 'doughnut',
                  data: {
                      labels: Object.keys(byOwner),
                      datasets: [{
                          data: Object.values(byOwner),
                          backgroundColor: ['#F4EBD6', '#3B82F6'],
                          borderWidth: 2,
                          borderColor: '#0F172A'
                      }]
                  },
                  options: {
                      responsive: true, maintainAspectRatio: false, cutout: '70%',
                      plugins: {
                          legend: { position: 'right', labels: { boxWidth: 10, color: '#CBD5E1', font: {size: 10} } }
                      }
                  }
              });
          }
      }

      async function fetchPositions() {
          setLoading(true);
          const { data, error } = await supabase.from('positions').select('*').order('date', { ascending: false });
          
          if (data && data.length > 0) {
              const latest = [];
              const seen = new Set();
              data.forEach(p => {
                  const key = `${p.owner}-${p.envelope}-${p.account_name}-${p.category}`;
                  if (!seen.has(key)) {
                      seen.add(key);
                      latest.push(p);
                  }
              });
              setPositions(latest);
              
              const initialForm = {};
              latest.forEach(p => initialForm[p.id] = p.value_eur);
              setFormValues(initialForm);
          }
          setLoading(false);
      }

      async function handleSeedDatabase() {
          setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          const dataToInsert = EXCEL_DATA.map(p => ({ ...p, date: today }));
          
          const { error } = await supabase.from('positions').insert(dataToInsert);
          
          if (error) {
              alert("Erreur : " + error.message);
          } else {
              fetchPositions();
          }
          setLoading(false);
      }

      async function handleLogin(e) {
          e.preventDefault();
          setLoading(true);
          setError('');
          const { error } = await supabase.auth.signInWithPassword({
              email: 'admin@patrimoine.app',
              password: password
          });
          if (error) setError('Mot de passe incorrect');
          setLoading(false);
      }

      async function handleLogout() {
          await supabase.auth.signOut();
          setSession(null);
      }

      async function handleSave(e) {
          e.preventDefault();
          setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          
          const newPositions = Object.keys(formValues).map(id => {
              const original = positions.find(p => p.id === id);
              return {
                  date: today,
                  owner: original.owner,
                  envelope: original.envelope,
                  account_name: original.account_name,
                  category: original.category,
                  value_eur: parseFloat(formValues[id]),
                  is_liability: original.is_liability
              };
          });

          const { error } = await supabase.from('positions').insert(newPositions);
          
          if (error) {
              alert("Erreur : " + error.message);
          } else {
              alert("Mise à jour enregistrée !");
              setView('dashboard');
              fetchPositions();
          }
          setLoading(false);
      }

      if (!session) {
          return (
              <div className="login-screen">
                  <form onSubmit={handleLogin} className="login-card">
                      <h1 className="serif">Patrimoine</h1>
                      <p>Private Wealth</p>
                      {error && <p className="error-msg">{error}</p>}
                      <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="login-input" />
                      <button type="submit" disabled={loading} className="btn-gold">
                          {loading ? "Connexion..." : "Accéder au portefeuille"}
                      </button>
                  </form>
              </div>
          );
      }

      const totalNet = filteredPositions.reduce((sum, p) => sum + p.value_eur, 0);
      const hasData = positions.length > 0;

      // Préparation du Top Enveloppes (sur les données filtrées)
      const byEnvelope = {};
      filteredPositions.forEach(p => {
          if (p.value_eur > 0) { 
             byEnvelope[p.envelope] = (byEnvelope[p.envelope] || 0) + p.value_eur;
          }
      });
      const topEnvelopes = Object.entries(byEnvelope).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const maxEnvelopeValue = topEnvelopes.length > 0 ? topEnvelopes[0][1] : 1;

      return (
          <div className="app-container">
              <header className="header">
                  <h2 className="serif">Mon Patrimoine</h2>
                  <button onClick={handleLogout} className="btn-logout">Déconnexion</button>
              </header>

              <main>
                  {view === 'dashboard' ? (
                      hasData ? (
                          <div>
                              {/* Filtre Propriétaire */}
                              <div className="owner-filter">
                                  {['Tous', 'Aubin', 'Oliwia'].map(owner => (
                                      <button 
                                          key={owner} 
                                          className={`owner-btn ${ownerFilter === owner ? 'active' : ''}`}
                                          onClick={() => setOwnerFilter(owner)}
                                      >
                                          {owner}
                                      </button>
                                  ))}
                              </div>

                              {/* Total */}
                              <div className="card" style={{borderBottom: '3px solid var(--gold)'}}>
                                  <div className="card-header">
                                      {ownerFilter === 'Tous' ? 'Patrimoine Net Total (Couple)' : `Patrimoine de ${ownerFilter}`}
                                  </div>
                                  <div className="total-amount">
                                      {totalNet.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}
                                  </div>
                              </div>

                              {/* Répartition Propriétaires (Visible seulement sur 'Tous') */}
                              {ownerFilter === 'Tous' && (
                                  <div className="card">
                                      <div className="card-header" style={{textAlign: 'center'}}>Répartition Familiale</div>
                                      <div className="chart-container-small">
                                          <canvas ref={ownerChartRef}></canvas>
                                      </div>
                                  </div>
                              )}

                              {/* Allocation par Catégorie */}
                              <div className="card">
                                  <div className="card-header" style={{textAlign: 'center'}}>Allocation d'Actifs {ownerFilter !== 'Tous' && `(${ownerFilter})`}</div>
                                  <div className="chart-container">
                                      <canvas ref={categoryChartRef}></canvas>
                                  </div>
                              </div>

                              {/* Top Enveloppes */}
                              <div className="card">
                                  <div className="card-header" style={{marginBottom: '20px'}}>Top Enveloppes</div>
                                  {topEnvelopes.map(([name, value], index) => (
                                      <div className="envelope-row" key={name}>
                                          <div className="envelope-info">
                                              <span>{name}</span>
                                              <span>{value.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>
                                          </div>
                                          <div className="envelope-bar-bg">
                                              <div className="envelope-bar-fill" style={{width: `${(value / maxEnvelopeValue) * 100}%`}}></div>
                                          </div>
                                      </div>
                                  ))}
                              </div>
                          </div>
                      ) : (
                          <div className="card" style={{textAlign: 'center', padding: '40px 20px'}}>
                              <p style={{color: 'var(--text-light)', marginBottom: '20px', lineHeight: '1.6'}}>
                                  Ta base de données est prête, mais elle est vide. Clique sur le bouton ci-dessous pour injecter tes données Excel.
                              </p>
                              <button onClick={handleSeedDatabase} disabled={loading} className="btn-gold">
                                  {loading ? "Initialisation..." : "Initialiser avec mon Excel"}
                              </button>
                          </div>
                      )
                  ) : (
                      <form onSubmit={handleSave}>
                          <p style={{fontSize: '0.85rem', color: 'var(--text-light)', marginBottom: '20px', lineHeight: '1.6'}}>
                              Mets à jour tes valeurs. L'enregistrement créera un nouvel historique.
                          </p>
                          
                          {positions.map(p => (
                              <div key={p.id} className="input-group">
                                  <div className="input-label">
                                      <p>{p.account_name}</p>
                                      <p>{p.owner} • {p.category}</p>
                                  </div>
                                  <input type="number" value={formValues[p.id] || ''} onChange={e => setFormValues({...formValues, [p.id]: e.target.value})} className="input-field" />
                              </div>
                          ))}
                          
                          {hasData && (
                              <button type="submit" disabled={loading} className="btn-gold" style={{marginTop: '30px'}}>
                                  {loading ? "Enregistrement..." : "Enregistrer la mise à jour"}
                              </button>
                          )}
                      </form>
                  )}
              </main>

              <nav className="bottom-nav">
                  <button onClick={() => setView('dashboard')} className={`nav-item ${view === 'dashboard' ? 'active' : ''}`}>
                      <span className="nav-icon">📊</span>
                      <span className="nav-text">Tableau de bord</span>
                  </button>
                  <button onClick={() => setView('saisie')} className={`nav-item ${view === 'saisie' ? 'active' : ''}`}>
                      <span className="nav-icon">✏️</span>
                      <span className="nav-text">Mise à jour</span>
                  </button>
              </nav>
          </div>
      );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
