<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useMemo, memo } = React;

  const SUPABASE_URL = 'https://geykxuqyspwzocvwzqjj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AsJvkk-erLkE5-pUbxiNnw_h2mmuuRN';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const ENVELOPPES_LIST = [ 'Compte Courant / Livret', 'Compte Bancaire', 'PEA', 'PEA-PME', 'Assurance-Vie', 'CTO', 'Entreprise', 'Crédit', 'Immobilier', 'PER', 'PEE', 'Autre' ];
  const CATEGORIES_LIST = [ 'Actions', 'Fonds euros', 'Livrets', 'SCPI', 'Private equity', 'Fonds diversifiés', 'Obligataire', 'Immobilier Brut', 'Dette Immobilière', 'Dettes Conso', 'Autre' ];
  const TARGET_CATEGORIES = ['Actions', 'Fonds euros', 'Livrets', 'SCPI', 'Private equity', 'Fonds diversifiés', 'Obligataire', 'Immobilier'];

  const HistoryChart = memo(({ history, color }) => {
    const chartRef = useRef(null);
    useEffect(() => {
        if (!chartRef.current || !history || history.length === 0) return;
        const ctx = chartRef.current.getContext('2d');
        const existing = Chart.getChart(ctx.canvas);
        if (existing) existing.destroy();
        const labels = history.map(h => new Date(h.snapshot_date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }));
        const dataPoints = history.map(h => Number(h.total_net));
        const gradient = ctx.createLinearGradient(0, 0, 0, 180);
        gradient.addColorStop(0, `${color}44`); gradient.addColorStop(1, `${color}00`);
        new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ data: dataPoints, borderColor: color, borderWidth: 2, backgroundColor: gradient, fill: true, tension: 0.3, pointRadius: history.length === 1 ? 4 : 0, pointHoverRadius: 5 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { label: (ctx) => `${ctx.parsed.y.toLocaleString('fr-FR')} €` } } }, scales: { x: { display: false }, y: { display: false } }, layout: { padding: { top: 10, bottom: 0, left: 0, right: 0 } } }
        });
    }, [history, color]);
    return <div className="history-chart-container"><canvas ref={chartRef}></canvas></div>;
  });

  const DonutChart = memo(({ sortedData, colors }) => {
    const chartRef = useRef(null);
    useEffect(() => {
        if (!chartRef.current || sortedData.length === 0) return;
        const ctx = chartRef.current.getContext('2d');
        const existing = Chart.getChart(ctx.canvas);
        if (existing) existing.destroy();
        new Chart(ctx, {
            type: 'doughnut',
            data: { labels: sortedData.map(d => d[0]), datasets: [{ data: sortedData.map(d => d[1]), backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '80%', animation: false, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });
    }, [sortedData, colors]);
    return <div className="chart-donut"><canvas ref={chartRef}></canvas></div>;
  });

  const FireChart = memo(({ data, color }) => {
    const chartRef = useRef(null);
    useEffect(() => {
        if (!chartRef.current || data.length === 0) return;
        const ctx = chartRef.current.getContext('2d');
        const existing = Chart.getChart(ctx.canvas);
        if (existing) existing.destroy();
        const labels = data.map(d => `Année ${d.year}`);
        const dataPoints = data.map(d => d.value);
        const gradient = ctx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, `${color}44`); gradient.addColorStop(1, `${color}00`);
        new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ data: dataPoints, borderColor: color, borderWidth: 3, backgroundColor: gradient, fill: true, tension: 0.4, pointRadius: 0, pointHoverRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { label: (ctx) => `${Math.round(ctx.parsed.y).toLocaleString('fr-FR')} €` } } }, scales: { x: { display: false }, y: { display: false } }, layout: { padding: { top: 10, bottom: 0, left: 0, right: 0 } } }
        });
    }, [data, color]);
    return <div className="history-chart-container" style={{height: '200px'}}><canvas ref={chartRef}></canvas></div>;
  });

  function App() {
      const [session, setSession] = useState(null);
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      
      const [positions, setPositions] = useState([]);
      const [historyData, setHistoryData] = useState([]);
      const [logs, setLogs] = useState([]);
      const [timeRange, setTimeRange] = useState('YTD');
      
      const [view, setView] = useState('dashboard');
      const [ownerFilter, setOwnerFilter] = useState('Tous');
      const [showPro, setShowPro] = useState(false);
      
      const [formValues, setFormValues] = useState(() => {
          const saved = localStorage.getItem('patrimoine_draft');
          return saved ? JSON.parse(saved) : {};
      });
      const [expandedEnv, setExpandedEnv] = useState(null);
      const [syncLoading, setSyncLoading] = useState(false);

      const [showAddForm, setShowAddForm] = useState(false);
      const [newAccount, setNewAccount] = useState({ owner: 'Aubin', envelope: 'PEA', account_name: '', category: 'Actions', value_eur: '', is_liability: false, is_professional: false });

      const [fireEpargne, setFireEpargne] = useState(1500);
      const [fireRendement, setFireRendement] = useState(7);

      const [targets, setTargets] = useState({});
      const [editTargetsMode, setEditTargetsMode] = useState(false);
      const [tempTargets, setTempTargets] = useState({});
      
      const [showRebalance, setShowRebalance] = useState(false);
      const [rebalanceAmount, setRebalanceAmount] = useState(1000);

      const [plnRate, setPlnRate] = useState(null);

      useEffect(() => {
          if (Object.keys(formValues).length > 0) {
              localStorage.setItem('patrimoine_draft', JSON.stringify(formValues));
          }
      }, [formValues]);

      useEffect(() => {
          supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
      }, []);

      useEffect(() => {
          if (session) {
              fetchPositions();
              fetchHistory();
              fetchTargets();
              fetchLogs();
              fetchPlnRate();
          }
      }, [session, ownerFilter]);

      async function fetchPlnRate() {
          try {
              const res = await fetch('https://api.frankfurter.app/latest?from=EUR&to=PLN');
              const data = await res.json();
              if (data && data.rates && data.rates.PLN) {
                  setPlnRate(data.rates.PLN);
              }
          } catch (err) {
              console.error("Erreur de récupération du taux de change", err);
          }
      }

      async function fetchPositions() {
          setLoading(true);
          const { data, error } = await supabase.from('latest_positions').select('*');
          if (error) setError("Erreur de chargement : " + error.message);
          else if (data) {
              setPositions(data);
              const newFormValues = { ...formValues };
              let hasChanged = false;
              data.forEach(p => {
                  if (newFormValues[p.id] === undefined) {
                      newFormValues[p.id] = p.value_eur;
                      hasChanged = true;
                  }
              });
              if (hasChanged) setFormValues(newFormValues);
          }
          setLoading(false);
      }

      async function fetchHistory() {
          const { data, error } = await supabase.rpc('get_wealth_history', { p_owner: ownerFilter });
          if (!error && data) setHistoryData(data);
      }

      async function fetchTargets() {
          const { data, error } = await supabase.from('target_allocations').select('*');
          if (!error && data) {
              const t = {};
              data.forEach(row => t[row.category] = row.target_percentage);
              setTargets(t);
              setTempTargets(t);
          }
      }

      async function fetchLogs() {
          const { data, error } = await supabase.from('positions').select('created_at, account_name, owner, value_eur').order('created_at', { ascending: false }).limit(50);
          if (!error && data) {
              const grouped = {};
              data.forEach(d => {
                  const day = new Date(d.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
                  if (!grouped[day]) grouped[day] = [];
                  grouped[day].push(d);
              });
              setLogs(grouped);
          }
      }

      const filteredPositions = positions.filter(p => {
          const matchOwner = ownerFilter === 'Tous' || p.owner === ownerFilter;
          const matchPro = showPro || !p.is_professional;
          return matchOwner && matchPro;
      });

      const totalActifs = filteredPositions.filter(p => p.value_eur > 0).reduce((sum, p) => sum + p.value_eur, 0);
      const totalPassifs = filteredPositions.filter(p => p.value_eur < 0).reduce((sum, p) => sum + p.value_eur, 0);
      const totalNet = totalActifs + totalPassifs;

      const fireData = useMemo(() => {
          const data = [];
          let current = totalNet;
          const monthlyRate = (fireRendement / 100) / 12;
          for (let year = 0; year <= 30; year++) {
              if (year > 0) {
                  for (let month = 1; month <= 12; month++) {
                      current = current * (1 + monthlyRate) + Number(fireEpargne);
                  }
              }
              data.push({ year, value: current });
          }
          return data;
      }, [totalNet, fireEpargne, fireRendement]);

      const filteredHistory = useMemo(() => {
          if (!historyData.length) return [];
          const now = new Date();
          const cutoff = new Date();
          switch (timeRange) {
              case '7J': cutoff.setDate(now.getDate() - 7); break;
              case '1M': cutoff.setMonth(now.getMonth() - 1); break;
              case '3M': cutoff.setMonth(now.getMonth() - 3); break;
              case '6M': cutoff.setMonth(now.getMonth() - 6); break;
              case 'YTD': cutoff.setMonth(0, 1); cutoff.setHours(0,0,0,0); break;
              case '1A': cutoff.setFullYear(now.getFullYear() - 1); break;
              case 'TOUT': default: return historyData;
          }
          const cutoffStr = cutoff.toISOString().split('T')[0];
          const result = historyData.filter(d => d.snapshot_date >= cutoffStr);
          return result.length >= 2 ? result : historyData.slice(-2);
      }, [historyData, timeRange]);

      const sortedChartData = useMemo(() => {
          const chartData = {};
          filteredPositions.forEach(p => {
              let cat = p.category;
              if (cat === 'Immobilier Brut') cat = 'Immobilier';
              if (cat === 'Dette Immobilière') return;
              if (p.value_eur > 0 || cat === 'Immobilier') {
                  chartData[cat] = (chartData[cat] || 0) + p.value_eur;
              }
          });
          const debtImmo = filteredPositions.filter(p => p.category === 'Dette Immobilière').reduce((sum, p) => sum + p.value_eur, 0);
          if (chartData['Immobilier']) chartData['Immobilier'] += debtImmo;
          return Object.entries(chartData).sort((a, b) => b[1] - a[1]);
      }, [filteredPositions]);

      const exposureMatrix = useMemo(() => {
          const matrix = {};
          filteredPositions.forEach(p => {
              let cat = p.category;
              if (cat === 'Immobilier Brut') cat = 'Immobilier';
              if (cat === 'Dette Immobilière') return;
              if (!cat || cat === 'Dettes Conso') return;
              
              if (!matrix[p.envelope]) matrix[p.envelope] = {};
              if (!matrix[p.envelope][cat]) matrix[p.envelope][cat] = 0;
              matrix[p.envelope][cat] += p.value_eur;
          });
          const activeCategories = TARGET_CATEGORIES.filter(cat => 
              Object.values(matrix).some(env => env[cat] && env[cat] > 0)
          );
          return { matrix, activeCategories };
      }, [filteredPositions]);

      const totalCategorized = sortedChartData.reduce((sum, [_, val]) => sum + val, 0);
      const actualPctData = {};
      sortedChartData.forEach(([cat, val]) => {
          if (TARGET_CATEGORIES.includes(cat)) {
              actualPctData[cat] = totalCategorized > 0 ? (val / totalCategorized) * 100 : 0;
          }
      });

      const targetPctData = {};
      TARGET_CATEGORIES.forEach(cat => {
          targetPctData[cat] = Number(targets[cat] || 0);
      });

      const currentTargetTotal = Object.values(tempTargets).reduce((sum, val) => sum + Number(val || 0), 0);

      const rebalanceData = useMemo(() => {
          if (!showRebalance) return [];
          const amount = Number(rebalanceAmount);
          const newTotal = totalCategorized + amount;
          const result = [];
          
          TARGET_CATEGORIES.forEach(cat => {
              const currentVal = sortedChartData.find(d => d[0] === cat)?.[1] || 0;
              const targetPct = Number(targets[cat] || 0) / 100;
              const targetValue = newTotal * targetPct;
              const diff = targetValue - currentVal;
              
              if (Math.abs(diff) > 1) {
                  result.push({ cat, diff });
              }
          });
          return result.sort((a,b) => b.diff - a.diff);
      }, [showRebalance, rebalanceAmount, sortedChartData, targets, totalCategorized]);

      const isOliwia = ownerFilter === 'Oliwia';
      const chartColors = isOliwia ? ['#E07A5F', '#81B29A', '#F2CC8F', '#3D405B', '#E9C46A', '#F4A261', '#E76F51'] : ['#D4AF37', '#3B82F6', '#10B981', '#E11D48', '#8B5CF6', '#64748B', '#F59E0B'];
      const themeStyle = isOliwia ? { '--gold': '#E07A5F', '--gold-light': '#F4F1DE', '--gold-dark': '#B05A42', '--gold-trans': 'rgba(224, 122, 95, 0.15)', '--glow': '0 0 15px rgba(224, 122, 95, 0.3)' } : { '--gold': '#D4AF37', '--gold-light': '#F4EBD6', '--gold-dark': '#A6833C', '--gold-trans': 'rgba(212, 175, 55, 0.15)', '--glow': '0 0 15px rgba(212, 175, 55, 0.2)' };

      // --- NOUVELLE FONCTION SYNCHRONISATION (Basée sur les conseils de l'IA) ---
      async function syncYahooPEA() {
          setSyncLoading(true);
          const tickers = ['PUST.PA', 'WPEA.PA'];
          const endpoint = `${SUPABASE_URL}/functions/v1/yahoo-quotes?tickers=${encodeURIComponent(tickers.join(','))}&t=${Date.now()}`;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);

          try {
              const response = await fetch(endpoint, { method: 'GET', signal: controller.signal });
              clearTimeout(timeoutId);

              if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);

              const data = await response.json();
              
              if (data.error) throw new Error(`Erreur interne : ${data.error}`);

              const pricePUST = data?.prices?.['PUST.PA'];
              const priceWPEA = data?.prices?.['WPEA.PA'];

              if (typeof pricePUST !== 'number' || typeof priceWPEA !== 'number') {
                  throw new Error(`Prix incomplets reçus.`);
              }

              const newPEAValue = Math.round((1343 * pricePUST) + (14543 * priceWPEA));
              const peaPosition = positions.find(p => p.envelope === 'PEA' && p.owner === 'Aubin');
              
              if (peaPosition) {
                  setFormValues(prev => ({ ...prev, [peaPosition.id]: newPEAValue }));
                  alert(`PEA actualisé avec succès !\n\nPUST: ${pricePUST.toFixed(2)} €\nWPEA: ${priceWPEA.toFixed(2)} €\n\nNouveau total: ${newPEAValue.toLocaleString('fr-FR')} €\n\nN'oublie pas d'enregistrer en bas.`);
              }
          } catch (err) {
              if (err.name === 'AbortError') {
                  alert("Erreur : Délai d'attente dépassé (10s). Vérifie ta connexion mobile.");
              } else {
                  alert("Erreur lors de la synchronisation : " + err.message);
              }
          } finally {
              setSyncLoading(false);
          }
      }

      function exportToJSON() {
          const exportData = {
              positions: positions,
              targets: targets,
              date_export: new Date().toISOString()
          };
          const jsonString = JSON.stringify(exportData, null, 2);
          const blob = new Blob([jsonString], { type: 'application/json' });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `Sauvegarde_Patrimoine_${new Date().toISOString().split('T')[0]}.json`;
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
      }

      function importFromJSON(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (e) => {
              try {
                  const data = JSON.parse(e.target.result);
                  if (!data.positions || !Array.isArray(data.positions)) throw new Error("Format invalide");
                  
                  if (!window.confirm(`Attention : cela va remplacer TOUTES tes données actuelles par celles de la sauvegarde (${data.positions.length} comptes). Continuer ?`)) return;
                  
                  setLoading(true);
                  await supabase.from('positions').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                  await supabase.from('positions').insert(data.positions);
                  
                  if (data.targets) {
                      const updates = TARGET_CATEGORIES.map(cat => ({ category: cat, target_percentage: Number(data.targets[cat] || 0) }));
                      await supabase.from('target_allocations').upsert(updates, { onConflict: 'category' });
                  }
                  
                  alert("Restauration terminée !");
                  fetchPositions(); fetchHistory(); fetchTargets();
              } catch (err) {
                  alert("Erreur de lecture du fichier : " + err.message);
              }
              setLoading(false);
          };
          reader.readAsText(file);
      }

      function quickAdd(id, amount) {
          setFormValues(prev => {
              const current = Number(prev[id]) || 0;
              return { ...prev, [id]: current + amount };
          });
      }

      function handleContractTotalChange(accountName, categories, newTotal) {
          const oldTotal = categories.reduce((sum, acc) => sum + (Number(formValues[acc.id]) || 0), 0);
          const newTotalNum = Number(newTotal);
          if (oldTotal === 0) {
              setFormValues(prev => ({ ...prev, [categories[0].id]: newTotalNum }));
              return;
          }
          const ratio = newTotalNum / oldTotal;
          const newValues = { ...formValues };
          categories.forEach(acc => {
              const currentVal = Number(formValues[acc.id]) || 0;
              newValues[acc.id] = Math.round(currentVal * ratio);
          });
          setFormValues(newValues);
      }

          e.preventDefault(); setLoading(true); setError('');
          const { error } = await supabase.auth.signInWithPassword({ email: 'admin@patrimoine.app', password: password });
          if (error) setError('Mot de passe incorrect');
          setLoading(false);
      }

      async function handleLogout() { await supabase.auth.signOut(); setSession(null); }

      async function handleSave(e) {
          e.preventDefault(); setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          const newPositions = Object.keys(formValues).map(id => {
              const original = positions.find(p => p.id === id);
              if (!original) return null;
              return { 
                  date: today, owner: original.owner, envelope: original.envelope, account_name: original.account_name, 
                  category: original.category || '', value_eur: Number(formValues[id] ?? 0), 
                  is_liability: original.is_liability, is_professional: original.is_professional || false
              };
          }).filter(Boolean);
          
          const { error } = await supabase.from('positions').upsert(newPositions, { onConflict: 'date,owner,envelope,account_name,category' });
          if (error) alert("Erreur : " + error.message);
          else { 
              localStorage.removeItem('patrimoine_draft');
              alert("Mise à jour enregistrée !"); 
              setView('dashboard'); fetchPositions(); fetchHistory(); fetchLogs(); 
          }
          setLoading(false);
      }

          e.preventDefault(); setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          const payload = {
              date: today, owner: newAccount.owner, envelope: newAccount.envelope, account_name: newAccount.account_name, 
              category: newAccount.category, value_eur: Number(newAccount.value_eur), is_liability: newAccount.is_liability, is_professional: newAccount.is_professional
          };
          const { error } = await supabase.from('positions').insert([payload]);
          if (error) alert("Erreur : " + error.message);
          else { setShowAddForm(false); setNewAccount({ owner: 'Aubin', envelope: 'PEA', account_name: '', category: 'Actions', value_eur: '', is_liability: false, is_professional: false }); fetchPositions(); fetchHistory(); fetchLogs(); }

      }

          if (!window.confirm(`Supprimer définitivement "${account.account_name}" ?`)) return;
          setLoading(true);
          const { error } = await supabase.from('positions').delete().match({ owner: account.owner, envelope: account.envelope, account_name: account.account_name, category: account.category || '' });
          if (error) alert("Erreur : " + error.message);
          else { fetchPositions(); fetchHistory(); fetchLogs(); }
          setLoading(false);
      }

      async function saveTargets() {
          if (Math.round(currentTargetTotal) !== 100) return alert("Le total doit être exactement de 100%.");
          setLoading(true);
          const updates = TARGET_CATEGORIES.map(cat => ({ category: cat, target_percentage: Number(tempTargets[cat] || 0) }));
          const { error } = await supabase.from('target_allocations').upsert(updates, { onConflict: 'category' });
          if (error) alert("Erreur : " + error.message);
          else { setTargets(tempTargets); setEditTargetsMode(false); }
          setLoading(false);
      }

          const newValue = Number(value); const oldValue = Number(tempTargets[cat] || 0); const diff = newValue - oldValue;
          if (diff > 0 && currentTargetTotal + diff > 100) return;
          setTempTargets({...tempTargets, [cat]: newValue});
      }

      if (!session) {
          return (
              <div className="login-screen">

                      <h1 className="serif">Patrimoine</h1>
                      <p>Private Wealth</p>
                      {error && <p className="error-msg">{error}</p>}
                      <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="login-input" />
                      <button type="submit" disabled={loading} className="btn-gold">{loading ? "Connexion..." : "Accéder au portefeuille"}</button>
                  </form>
              </div>
          );
      }

      const groupedByEnvelope = {};
      filteredPositions.forEach(p => {
          if (!groupedByEnvelope[p.envelope]) groupedByEnvelope[p.envelope] = { total: 0, accounts: [] };
          groupedByEnvelope[p.envelope].total += p.value_eur;
          groupedByEnvelope[p.envelope].accounts.push(p);
      });
      const sortedEnvelopes = Object.entries(groupedByEnvelope).sort((a, b) => b[1].total - a[1].total);

      const groupedForSaisie = {};
      filteredPositions.forEach(p => {
          if (!groupedForSaisie[p.envelope]) groupedForSaisie[p.envelope] = {};
          if (!groupedForSaisie[p.envelope][p.account_name]) groupedForSaisie[p.envelope][p.account_name] = [];
          groupedForSaisie[p.envelope][p.account_name].push(p);
      });
      const sortedSaisieEnvelopes = Object.entries(groupedForSaisie).sort((a, b) => {
          const totalA = Object.values(a[1]).flat().reduce((sum, p) => sum + p.value_eur, 0);
          const totalB = Object.values(b[1]).flat().reduce((sum, p) => sum + p.value_eur, 0);
          return totalB - totalA;
      });

      return (
          <div className="app-container" style={themeStyle}>
              <header className="header">
                  <h2 className="serif">Mon Patrimoine</h2>
                  <button onClick={handleLogout} className="btn-logout">Déconnexion</button>
              </header>

              <main>
                  {view === 'dashboard' && (
                      positions.length > 0 ? (
                          <div>
                              <div className="filters-container">
                                  <div className="owner-filter">
                                      {['Tous', 'Aubin', 'Oliwia'].map(owner => (
                                          <button key={owner} className={`owner-btn ${ownerFilter === owner ? 'active' : ''}`} onClick={() => setOwnerFilter(owner)}>{owner}</button>
                                      ))}
                                  </div>
                                  <label className="pro-toggle">
                                      <input type="checkbox" checked={showPro} onChange={(e) => setShowPro(e.target.checked)} />
                                      Inclure le Pro
                                  </label>
                              </div>

                              <div className="card">
                                  <div className="ap-label">Patrimoine net</div>
                                  <div className="total-amount">{totalNet.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</div>
                                  <HistoryChart history={filteredHistory} color={isOliwia ? '#E07A5F' : '#D4AF37'} />
                                  <div className="time-filters">

                                  <div className="actifs-passifs">
                                      <div className="ap-item">

                                      </div>
                                      <div className="ap-item" style={{alignItems: 'flex-end'}}>
                                          <span className="ap-label">Passifs</span>
                                          <span className="ap-value negative">{totalPassifs.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>
                                      </div>
                                  </div>
                              </div>

                              <div className="card">

                                  <div className="allocation-container">
                                      <DonutChart sortedData={sortedChartData} colors={chartColors} />

                                              return (

                                                      <span>{acc.value_eur.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>

                              <p style={{color: 'var(--text-light)', fontSize: '0.85rem'}}>{error || "La base de données Supabase est vide."}</p>

                      )
                  )}

                  {view === 'saisie' && (
                      <div>
                          <div style={{display: 'flex', gap: '10px', marginBottom: '15px'}}>

                                  return (
                                  <div className="card" key={envName} style={{padding: '20px'}}>
                                      <div className="update-header">
                                          <h3 className="serif" style={{fontSize: '1.2rem', color: 'var(--gold-light)'}}>{envName}</h3>
                                          <div style={{fontSize: '0.9rem', fontWeight: 'bold', color: 'var(--gold)'}}>
                                              {Math.round(envTotal).toLocaleString('fr-FR')} €
                                          </div>
                                      </div>

                                      {Object.entries(contractsObj).map(([contractName, categories]) => {
                                          const contractTotal = categories.reduce((sum, p) => sum + (Number(formValues[p.id]) || 0), 0);
                                          
                                          const isPolishAccount = contractName.includes('PKO') || contractName.includes('mBank');
                                          const displayValue = isPolishAccount && plnRate ? Math.round(contractTotal * plnRate) : Math.round(contractTotal);

                                          return (
                                              <div key={contractName} style={{marginTop: '10px'}}>
                                                  <div className="contract-header">
                                                      <span className="contract-title">
                                                          {contractName} {isPolishAccount && <span style={{fontSize:'0.7rem', color:'var(--text-light)'}}>(en PLN)</span>}
                                                      </span>
                                                      {categories.length > 1 && (
                                                          <div className="total-input-container">
                                                              <span>Total :</span>
                                                              <input 
                                                                  type="number" 
                                                                  className="total-input" 
                                                                  value={displayValue}
                                                                  onChange={(e) => {
                                                                      const newVal = Number(e.target.value);
                                                                      const valInEuro = isPolishAccount && plnRate ? newVal / plnRate : newVal;
                                                                      handleContractTotalChange(contractName, categories, valInEuro);
                                                                  }}
                                                              />
                                                          </div>
                                                      )}
                                                  </div>

                                                  <table className="update-table">
                                                      <thead><tr><th>Support</th><th>Prop.</th><th style={{textAlign: 'right'}}>Valeur (€)</th></tr></thead>
                                                      <tbody>
                                                          {categories.map(p => (
                                                              <tr key={p.id}>
                                                                  <td style={{color: 'var(--gold)'}}>{p.category || 'Général'}</td>
                                                                  <td style={{color: 'var(--text-light)', fontSize: '0.75rem'}}>{p.owner}</td>
                                                                  <td style={{textAlign: 'right'}}>
                                                                      <div className="input-wrapper">
                                                                          <button type="button" className="quick-btn" onClick={() => quickAdd(p.id, -1000)}>-</button>
                                                                          <input type="number" step="any" value={formValues[p.id] ?? ''} onChange={e => setFormValues(prev => ({...prev, [p.id]: e.target.value}))} className="table-input" />
                                                                          <button type="button" className="quick-btn" onClick={() => quickAdd(p.id, 1000)}>+</button>
                                                                          <button type="button" onClick={() => handleDeleteAccount(p)} className="btn-delete" title="Supprimer">🗑️</button>
                                                                      </div>
                                                                  </td>
                                                              </tr>
                                                          ))}
                                                      </tbody>
                                                  </table>
                                              </div>
                                          )
                                      })}
                                  </div>
                              )})}
                              
                              {positions.length > 0 && (
                                  <button type="submit" disabled={loading} className="btn-gold" style={{marginTop: '10px', marginBottom: '30px'}}>
                                      {loading ? "Enregistrement..." : "Enregistrer les modifications"}
                                  </button>
                              )}
                          </form>
                      </div>
                  )}

                  {view === 'projection' && (
                      <div>
                          <div className="card">
                              <div className="ap-label" style={{marginBottom: '20px'}}>Simulateur FIRE</div>
                              <div className="slider-container">
                                  <div className="slider-header"><span className="slider-label">Épargne mensuelle</span><span className="slider-value">{Number(fireEpargne).toLocaleString('fr-FR')} €</span></div>
                                  <input type="range" min="0" max="20000" step="100" value={fireEpargne} onChange={e => setFireEpargne(e.target.value)} />
                              </div>
                              <div className="slider-container">
                                  <div className="slider-header"><span className="slider-label">Rendement annuel estimé</span><span className="slider-value">{fireRendement} %</span></div>
                                  <input type="range" min="1" max="15" step="0.5" value={fireRendement} onChange={e => setFireRendement(e.target.value)} />
                              </div>
                              <FireChart data={fireData} color={isOliwia ? '#E07A5F' : '#D4AF37'} />
                              <div className="fire-result">
                                  <div className="fire-box"><div className="fire-box-label">Dans 5 ans</div><div className="fire-box-value">{Math.round(fireData[5].value).toLocaleString('fr-FR')} €</div></div>
                                  <div className="fire-box"><div className="fire-box-label">Dans 10 ans</div><div className="fire-box-value">{Math.round(fireData[10].value).toLocaleString('fr-FR')} €</div></div>
                                  <div className="fire-box"><div className="fire-box-label">Dans 20 ans</div><div className="fire-box-value">{Math.round(fireData[20].value).toLocaleString('fr-FR')} €</div></div>
                                  <div className="fire-box"><div className="fire-box-label">Dans 30 ans</div><div className="fire-box-value">{Math.round(fireData[30].value).toLocaleString('fr-FR')} €</div></div>
                              </div>
                          </div>
                      </div>
                  )}

                  {view === 'cible' && (
                      <div>
                          {editTargetsMode ? (
                              <div className="card">
                                  <div className="ap-label" style={{marginBottom: '10px'}}>Définir mes cibles (%)</div>
                                  <div className={`total-indicator ${Math.round(currentTargetTotal) === 100 ? 'ok' : 'not-ok'}`}>Total : {currentTargetTotal.toFixed(0)}% / 100%</div>
                                  {TARGET_CATEGORIES.map(cat => (
                                      <div className="slider-container" key={cat}>
                                          <div className="slider-header"><span className="slider-label">{cat}</span><span className="slider-value">{tempTargets[cat] || 0} %</span></div>
                                          <input type="range" min="0" max="100" step="1" value={tempTargets[cat] || 0} onChange={e => handleTargetSliderChange(cat, e.target.value)} />
                                      </div>
                                  ))}
                                  <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
                                      <button onClick={() => { setEditTargetsMode(false); setTempTargets(targets); }} className="btn-export" style={{flex:1, marginBottom:0}}>Annuler</button>
                                      <button onClick={saveTargets} className="btn-gold" style={{flex:2}} disabled={Math.round(currentTargetTotal) !== 100}>Enregistrer</button>
                                  </div>
                              </div>
                          ) : (
                              <div>
                                  <div style={{display: 'flex', gap: '10px', marginBottom: '20px'}}>
                                      <button onClick={() => setEditTargetsMode(true)} className="btn-sync" style={{flex:1, marginBottom:0}}>✏️ Modifier</button>
                                      <button onClick={() => setShowRebalance(!showRebalance)} className="btn-gold" style={{flex:1}}>⚖️ Rééquilibrer</button>
                                  </div>

                                  {showRebalance && (
                                      <div className="card" style={{border: '1px solid var(--gold)'}}>
                                          <div className="ap-label" style={{marginBottom: '15px'}}>Plan d'investissement</div>
                                          <div className="slider-container">
                                              <div className="slider-header"><span className="slider-label">Montant à investir</span><span className="slider-value">{Number(rebalanceAmount).toLocaleString('fr-FR')} €</span></div>
                                              <input type="range" min="0" max="50000" step="100" value={rebalanceAmount} onChange={e => setRebalanceAmount(e.target.value)} />
                                          </div>
                                          
                                          <div style={{background: 'rgba(0,0,0,0.2)', padding: '15px', borderRadius: '12px'}}>
                                              <p style={{fontSize: '0.8rem', color: 'var(--text-light)', marginBottom: '10px'}}>Pour respecter ta cible, voici comment répartir cet argent :</p>
                                              {rebalanceData.map(({cat, diff}) => (
                                                  <div key={cat} style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.9rem', marginBottom: '5px'}}>
                                                      <span>{cat}</span>
                                                      <span style={{color: diff > 0 ? 'var(--green)' : 'var(--red)', fontWeight: 'bold'}}>
                                                          {diff > 0 ? '+' : ''}{Math.round(diff).toLocaleString('fr-FR')} €
                                                      </span>
                                                  </div>
                                              ))}
                                              {rebalanceData.length === 0 && <p style={{fontSize:'0.8rem', textAlign:'center'}}>Ton allocation est déjà parfaite !</p>}
                                          </div>
                                      </div>
                                  )}

                                  <div className="card">
                                      <div className="ap-label" style={{marginBottom: '20px'}}>Cible vs Réel</div>
                                      {TARGET_CATEGORIES.map(cat => {
                                          const actual = actualPctData[cat] || 0; const target = targetPctData[cat] || 0;
                                          return (
                                              <div className="target-bar-container" key={cat}>
                                                  <div className="target-bar-label">
                                                      <span>{cat}</span>
                                                      <span style={{color: actual > target + 5 ? 'var(--gold)' : actual < target - 5 ? 'var(--red)' : 'var(--text-light)'}}>Réel: {actual.toFixed(1)}% / Cible: {target.toFixed(0)}%</span>
                                                  </div>
                                                  <div className="target-bar-bg"><div className="target-bar-target" style={{width: `${target}%`}}></div><div className="target-bar-actual" style={{width: `${actual}%`}}></div></div>
                                              </div>
                                          );
                                      })}
                                  </div>
                              </div>
                          )}
                      </div>
                  )}

                  {view === 'journal' && (
                      <div className="card">
                          <div className="ap-label" style={{marginBottom: '20px'}}>Journal des opérations</div>
                          {Object.keys(logs).length === 0 ? (
                              <p style={{color: 'var(--text-light)', textAlign: 'center'}}>Aucune opération.</p>
                          ) : (
                              Object.entries(logs).map(([date, items]) => (
                                  <div key={date} style={{marginBottom: '20px'}}>
                                      <div style={{fontSize: '0.8rem', color: 'var(--gold)', fontWeight: 'bold', marginBottom: '10px'}}>{date}</div>
                                      {items.map((item, i) => (
                                          <div className="log-item" key={i}>
                                              <div className="log-content">Mise à jour de <strong>{item.account_name}</strong> ({item.owner}) à {Number(item.value_eur).toLocaleString('fr-FR')} €</div>
                                          </div>
                                      ))}
                                  </div>
                              ))
                          )}
                      </div>
                  )}
              </main>

              <nav className="bottom-nav">
                  <button onClick={() => setView('dashboard')} className={`nav-item ${view === 'dashboard' ? 'active' : ''}`}><span className="nav-icon">📊</span><span className="nav-text">Dashboard</span></button>
                  <button onClick={() => setView('saisie')} className={`nav-item ${view === 'saisie' ? 'active' : ''}`}><span className="nav-icon">✏️</span><span className="nav-text">Saisie</span></button>
                  <button onClick={() => setView('cible')} className={`nav-item ${view === 'cible' ? 'active' : ''}`}><span className="nav-icon">🎯</span><span className="nav-text">Cible</span></button>
                  <button onClick={() => setView('projection')} className={`nav-item ${view === 'projection' ? 'active' : ''}`}><span className="nav-icon">🔮</span><span className="nav-text">FIRE</span></button>
                  <button onClick={() => setView('journal')} className={`nav-item ${view === 'journal' ? 'active' : ''}`}><span className="nav-icon">📜</span><span className="nav-text">Journal</span></button>
              </nav>
          </div>
      );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
