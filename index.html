<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mon Patrimoine - Private Wealth</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    /* NOUVELLE CHARTE GRAPHIQUE : NOIR MAT / GRAPHITE / BRONZE */
    --bg-dark: #121212; /* Dominante 60% : Charbon/Noir mat */
    --bg-card-dark: #1A1A1A; /* Secondaire 30% : Gris très sombre pour les cartes */
    --bg-secondary: #2A2A2A; /* Gris graphite pour les séparations */
    --border-color: #3F3F46;
    
    --gold: #C5A059; /* Accent 10% : Or/Bronze étincelant */
    --gold-light: #E8D8B8; /* Variante claire pour les textes */
    --gold-dark: #9E7D3E;
    --gold-trans: rgba(197, 160, 89, 0.15);
    --glow: 0 0 15px rgba(197, 160, 89, 0.25);
    
    --text-light: #A0A0A0;
    --text-white: #FFFFFF;
    --red: #E11D48;
    --shadow-3d: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.05) 0%, transparent 50%);
    color: var(--text-white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

  .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { background: var(--bg-card-dark); border: 1px solid var(--bg-secondary); padding: 50px 30px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow-3d), var(--glow); }
  .login-card h1 { font-size: 2.2rem; color: #fff; margin-bottom: 5px; }
  .login-card p { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 30px; }
  .login-input { width: 100%; padding: 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; text-align: center; font-size: 1.2rem; letter-spacing: 0.2em; margin-bottom: 20px; outline: none; }
  .login-input:focus { border-color: var(--gold); box-shadow: var(--glow);}
  .btn-gold { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #121212; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3); transition: transform 0.2s; }
  .btn-gold:active { transform: scale(0.98); }
  
  .app-container { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 25px 0; }
  .header h2 { font-size: 1.5rem; color: #fff; }
  .btn-logout { background: none; border: none; color: var(--text-light); font-size: 0.8rem; text-decoration: underline; cursor: pointer; }

  .filters-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
  .owner-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
  .owner-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-light); padding: 8px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
  .owner-btn.active { background: var(--gold); color: var(--bg-dark); border-color: var(--gold); box-shadow: var(--glow); font-weight: 700; }
  
  .pro-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-light); cursor: pointer; background: var(--bg-secondary); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); }
  .pro-toggle input { accent-color: var(--gold); }

  .card { background: var(--bg-card-dark); border-radius: 20px; padding: 25px; box-shadow: var(--shadow-3d); border: 1px solid var(--border-color); margin-bottom: 20px; }
  .history-chart-container { position: relative; height: 180px; width: 100%; margin-top: 10px; }
  .time-filters { display: flex; justify-content: space-between; margin-top: 20px; }
  .time-btn { background: transparent; border: none; color: var(--text-light); font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 5px 10px; border-radius: 15px; transition: all 0.2s; }
  .time-btn.active { background: var(--bg-secondary); color: #fff; }
  
  .total-amount { font-size: 2.8rem; font-family: 'Playfair Display', serif; font-weight: 500; color: var(--gold-light); line-height: 1.1; margin-bottom: 5px; text-shadow: var(--glow); }

  .actifs-passifs { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid var(--bg-secondary); padding-top: 20px; }
  .ap-item { display: flex; flex-direction: column; gap: 5px; }
  .ap-label { font-size: 0.85rem; color: var(--text-light); }
  .ap-value { font-size: 1.1rem; font-weight: 600; color: #fff; }
  .ap-value.negative { color: var(--red); }

  .allocation-container { display: flex; align-items: center; gap: 20px; margin-top: 15px; }
  .chart-donut { width: 130px; height: 130px; flex-shrink: 0; }
  .legend-custom { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .legend-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
  .legend-color { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .legend-name { color: var(--text-light); display: flex; align-items: center; flex: 1; }
  .legend-percent { color: var(--gold); font-weight: 600; }

  .envelope-item { border-bottom: 1px solid var(--bg-secondary); }
  .envelope-item:last-child { border-bottom: none; }
  .envelope-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; cursor: pointer; }
  .envelope-title { font-size: 0.95rem; color: #fff; display: flex; align-items: center; gap: 10px; }
  .envelope-icon { font-size: 0.7rem; color: var(--gold); transition: transform 0.3s; }
  .envelope-icon.open { transform: rotate(90deg); }
  .envelope-value { font-weight: 500; color: #fff; }
  .envelope-details { padding-bottom: 15px; padding-left: 20px; display: none; }
  .envelope-details.open { display: block; }
  .account-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-light); padding: 6px 0; }

  .input-group { display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); }
  .input-label p:first-child { font-weight: 500; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
  .input-label p:last-child { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
  .input-field { width: 110px; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); text-align: right; font-weight: 600; font-size: 1rem; color: var(--gold-light); background: var(--bg-dark); outline: none; transition: border 0.3s; }
  .input-field:focus { border-color: var(--gold); }
  .btn-delete { background: transparent; border: none; color: var(--red); font-size: 1.2rem; cursor: pointer; padding: 5px; margin-left: 10px; opacity: 0.7; transition: opacity 0.2s; }
  .btn-delete:hover { opacity: 1; }
  
  .btn-sync { background: var(--gold-trans); border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s;}
  .btn-sync:hover { background: rgba(197, 160, 89, 0.25); }
  .btn-export { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-light); padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s;}
  .btn-export:hover { background: var(--border-color); color: #fff; }

  .add-form { background: var(--bg-secondary); border: 1px dashed var(--gold); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
  .add-form.open { display: block; }
  .add-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .add-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-dark); color: #fff; outline: none; }
  .add-input:focus { border-color: var(--gold); }
  
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--bg-secondary); display: flex; justify-content: center; gap: 50px; align-items: center; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; color: #555555; transition: color 0.3s; }
  .nav-item.active { color: var(--gold); }
  .nav-icon { font-size: 1.3rem; }
  .nav-text { font-size: 0.7rem; font-weight: 500; }
  .error-msg { color: var(--red); font-size: 0.8rem; margin-bottom: 15px; text-align: center; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useMemo, memo } = React;

  const SUPABASE_URL = 'https://geykxuqyspwzocvwzqjj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AsJvkk-erLkE5-pUbxiNnw_h2mmuuRN';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const HistoryChart = memo(({ history, color }) => {
    const chartRef = useRef(null);
    useEffect(() => {
        if (!chartRef.current || !history || history.length === 0) return;
        const ctx = chartRef.current.getContext('2d');
        const existing = Chart.getChart(ctx.canvas);
        if (existing) existing.destroy();

        const labels = history.map(h => new Date(h.snapshot_date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }));
        const dataPoints = history.map(h => Number(h.total_net));
        const gradient = ctx.createLinearGradient(0, 0, 0, 180);
        gradient.addColorStop(0, `${color}44`); gradient.addColorStop(1, `${color}00`);

        new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ data: dataPoints, borderColor: color, borderWidth: 2, backgroundColor: gradient, fill: true, tension: 0.3, pointRadius: history.length === 1 ? 4 : 0, pointHoverRadius: 5 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { label: (ctx) => `${ctx.parsed.y.toLocaleString('fr-FR')} €` } } }, scales: { x: { display: false }, y: { display: false } }, layout: { padding: { top: 10, bottom: 0, left: 0, right: 0 } } }
        });
    }, [history, color]);
    return <div className="history-chart-container"><canvas ref={chartRef}></canvas></div>;
  });

  const DonutChart = memo(({ sortedData, colors }) => {
    const chartRef = useRef(null);
    useEffect(() => {
        if (!chartRef.current || sortedData.length === 0) return;
        const ctx = chartRef.current.getContext('2d');
        const existing = Chart.getChart(ctx.canvas);
        if (existing) existing.destroy();
        new Chart(ctx, {
            type: 'doughnut',
            data: { labels: sortedData.map(d => d[0]), datasets: [{ data: sortedData.map(d => d[1]), backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '80%', animation: false, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });
    }, [sortedData, colors]);
    return <div className="chart-donut"><canvas ref={chartRef}></canvas></div>;
  });


  function App() {
      const [session, setSession] = useState(null);
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      
      const [positions, setPositions] = useState([]);
      const [historyData, setHistoryData] = useState([]);
      const [timeRange, setTimeRange] = useState('YTD');
      
      const [view, setView] = useState('dashboard');
      const [ownerFilter, setOwnerFilter] = useState('Tous');
      const [showPro, setShowPro] = useState(false);
      
      const [formValues, setFormValues] = useState({});
      const [expandedEnv, setExpandedEnv] = useState(null);
      const [syncLoading, setSyncLoading] = useState(false);

      const [showAddForm, setShowAddForm] = useState(false);
      const [newAccount, setNewAccount] = useState({
          owner: 'Aubin', envelope: '', account_name: '', category: '', value_eur: '', is_liability: false, is_professional: false
      });

      useEffect(() => {
          supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
      }, []);

      useEffect(() => {
          if (session) {
              fetchPositions();
              fetchHistory();
          }
      }, [session, ownerFilter]);

      async function fetchPositions() {
          setLoading(true);
          const { data, error } = await supabase.from('latest_positions').select('*');
          if (error) {
              setError("Erreur de chargement : " + error.message);
          } else if (data) {
              setPositions(data);
              const initialForm = {};
              data.forEach(p => initialForm[p.id] = p.value_eur);
              setFormValues(initialForm);
          }
          setLoading(false);
      }

      async function fetchHistory() {
          const { data, error } = await supabase.rpc('get_wealth_history', { p_owner: ownerFilter });
          if (!error && data) setHistoryData(data);
      }

      const filteredPositions = positions.filter(p => {
          const matchOwner = ownerFilter === 'Tous' || p.owner === ownerFilter;
          const matchPro = showPro || !p.is_professional;
          return matchOwner && matchPro;
      });

      const totalActifs = filteredPositions.filter(p => p.value_eur > 0).reduce((sum, p) => sum + p.value_eur, 0);
      const totalPassifs = filteredPositions.filter(p => p.value_eur < 0).reduce((sum, p) => sum + p.value_eur, 0);
      const totalNet = totalActifs + totalPassifs;

      const filteredHistory = useMemo(() => {
          if (!historyData.length) return [];
          const now = new Date();
          const cutoff = new Date();
          switch (timeRange) {
              case '7J': cutoff.setDate(now.getDate() - 7); break;
              case '1M': cutoff.setMonth(now.getMonth() - 1); break;
              case '3M': cutoff.setMonth(now.getMonth() - 3); break;
              case '6M': cutoff.setMonth(now.getMonth() - 6); break;
              case 'YTD': cutoff.setMonth(0, 1); cutoff.setHours(0,0,0,0); break;
              case '1A': cutoff.setFullYear(now.getFullYear() - 1); break;
              case 'TOUT': default: return historyData;
          }
          const cutoffStr = cutoff.toISOString().split('T')[0];
          const result = historyData.filter(d => d.snapshot_date >= cutoffStr);
          return result.length >= 2 ? result : historyData.slice(-2);
      }, [historyData, timeRange]);

      const sortedChartData = useMemo(() => {
          const chartData = {};
          filteredPositions.forEach(p => {
              let cat = p.category;
              if (cat === 'Immobilier Brut') cat = 'Immobilier';
              if (cat === 'Dette Immobilière') return;
              if (p.value_eur > 0 || cat === 'Immobilier') {
                  chartData[cat] = (chartData[cat] || 0) + p.value_eur;
              }
          });
          const debtImmo = filteredPositions.filter(p => p.category === 'Dette Immobilière').reduce((sum, p) => sum + p.value_eur, 0);
          if (chartData['Immobilier']) chartData['Immobilier'] += debtImmo;
          return Object.entries(chartData).sort((a, b) => b[1] - a[1]);
      }, [filteredPositions]);

      const isOliwia = ownerFilter === 'Oliwia';
      
      // Palette pour Oliwia (Terre pastel) / Palette pour Aubin (Or-Bronze-Neutre)
      const chartColors = isOliwia 
          ? ['#E07A5F', '#81B29A', '#F2CC8F', '#3D405B', '#E9C46A', '#F4A261', '#E76F51'] 
          : ['#C5A059', '#3F3F46', '#E8D8B8', '#71717A', '#9E7D3E', '#A1A1AA', '#52525B'];

      // Thème dynamique : Oliwia passe en "Terre pastel", sinon on garde le thème par défaut (Noir mat / Or)
      const themeStyle = isOliwia ? {
          '--bg-dark': '#121212', // On garde le fond noir mat
          '--bg-card-dark': '#1A1A1A',
          '--bg-secondary': '#2A2A2A',
          '--border-color': '#3F3F46',
          '--gold': '#E07A5F', 
          '--gold-light': '#F4F1DE', 
          '--gold-dark': '#B05A42', 
          '--gold-trans': 'rgba(224, 122, 95, 0.15)', 
          '--glow': '0 0 15px rgba(224, 122, 95, 0.3)'
      } : {};

      async function syncYahooPEA() {
          setSyncLoading(true);
          try {
              const proxy = 'https://corsproxy.io/?';
              const [resPUST, resWPEA] = await Promise.all([
                  fetch(proxy + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/PUST.PA')),
                  fetch(proxy + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/WPEA.PA'))
              ]);
              const dataPUST = await resPUST.json();
              const dataWPEA = await resWPEA.json();
              const pricePUST = dataPUST.chart.result[0].meta.regularMarketPrice;
              const priceWPEA = dataWPEA.chart.result[0].meta.regularMarketPrice;
              const newPEAValue = (1343 * pricePUST) + (14543 * priceWPEA);
              const peaPosition = positions.find(p => p.envelope === 'PEA' && p.owner === 'Aubin');
              if (peaPosition) {
                  setFormValues(prev => ({ ...prev, [peaPosition.id]: Math.round(newPEAValue) }));
                  alert(`PEA mis à jour : ${Math.round(newPEAValue).toLocaleString('fr-FR')} €\n\nN'oublie pas d'enregistrer !`);
              }
          } catch (err) { alert("Erreur de connexion à Yahoo Finance. Le proxy est peut-être en maintenance."); }
          setSyncLoading(false);
      }

      function exportToCSV() {
          const headers = ['Proprietaire', 'Enveloppe', 'Nom du compte', 'Categorie', 'Valeur (EUR)'];
          const rows = filteredPositions.map(p => [p.owner, p.envelope, p.account_name, p.category || '', p.value_eur.toString().replace('.', ',')]);
          const csvContent = [headers, ...rows].map(e => e.join(";")).join("\n");
          const blob = new Blob(["\ufeff"+csvContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement("a");
          link.setAttribute("href", URL.createObjectURL(blob));
          link.setAttribute("download", `Patrimoine_${ownerFilter}_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
      }

      async function handleLogin(e) {
          e.preventDefault(); setLoading(true); setError('');
          const { error } = await supabase.auth.signInWithPassword({ email: 'admin@patrimoine.app', password: password });
          if (error) setError('Mot de passe incorrect');
          setLoading(false);
      }

      async function handleLogout() { await supabase.auth.signOut(); setSession(null); }

      async function handleSave(e) {
          e.preventDefault(); setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          const newPositions = Object.keys(formValues).map(id => {
              const original = positions.find(p => p.id === id);
              return { 
                  date: today, owner: original.owner, envelope: original.envelope, account_name: original.account_name, 
                  category: original.category || '', value_eur: Number(formValues[id] ?? 0), 
                  is_liability: original.is_liability, is_professional: original.is_professional || false
              };
          });
          const { error } = await supabase.from('positions').upsert(newPositions, { onConflict: 'date,owner,envelope,account_name,category' });
          if (error) alert("Erreur : " + error.message);
          else { alert("Mise à jour enregistrée !"); setView('dashboard'); fetchPositions(); fetchHistory(); }
          setLoading(false);
      }

      async function handleAddAccount(e) {
          e.preventDefault(); setLoading(true);
          const today = new Date().toISOString().split('T')[0];
          const payload = {
              date: today, owner: newAccount.owner, envelope: newAccount.envelope, account_name: newAccount.account_name,
              category: newAccount.category, value_eur: Number(newAccount.value_eur), 
              is_liability: newAccount.is_liability, is_professional: newAccount.is_professional
          };
          const { error } = await supabase.from('positions').insert([payload]);
          if (error) alert("Erreur : " + error.message);
          else {
              setShowAddForm(false);
              setNewAccount({ owner: 'Aubin', envelope: '', account_name: '', category: '', value_eur: '', is_liability: false, is_professional: false });
              fetchPositions(); fetchHistory();
          }
          setLoading(false);
      }

      async function handleDeleteAccount(account) {
          if (!window.confirm(`Supprimer définitivement "${account.account_name}" et tout son historique ?`)) return;
          setLoading(true);
          const { error } = await supabase.from('positions').delete().match({ 
              owner: account.owner, envelope: account.envelope, account_name: account.account_name, category: account.category || ''
          });
          if (error) alert("Erreur : " + error.message);
          else { fetchPositions(); fetchHistory(); }
          setLoading(false);
      }

      if (!session) {
          return (
              <div className="login-screen">
                  <form onSubmit={handleLogin} className="login-card">
                      <h1 className="serif">Patrimoine</h1>
                      <p>Private Wealth</p>
                      {error && <p className="error-msg">{error}</p>}
                      <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="login-input" />
                      <button type="submit" disabled={loading} className="btn-gold">{loading ? "Connexion..." : "Accéder au portefeuille"}</button>
                  </form>
              </div>
          );
      }

      const groupedByEnvelope = {};
      filteredPositions.forEach(p => {
          if (!groupedByEnvelope[p.envelope]) groupedByEnvelope[p.envelope] = { total: 0, accounts: [] };
          groupedByEnvelope[p.envelope].total += p.value_eur;
          groupedByEnvelope[p.envelope].accounts.push(p);
      });
      const sortedEnvelopes = Object.entries(groupedByEnvelope).sort((a, b) => b[1].total - a[1].total);

      return (
          <div className="app-container" style={themeStyle}>
              <header className="header">
                  <h2 className="serif">Mon Patrimoine</h2>
                  <button onClick={handleLogout} className="btn-logout">Déconnexion</button>
              </header>

              <main>
                  {view === 'dashboard' ? (
                      positions.length > 0 ? (
                          <div>
                              <div className="filters-container">
                                  <div className="owner-filter">
                                      {['Tous', 'Aubin', 'Oliwia'].map(owner => (
                                          <button key={owner} className={`owner-btn ${ownerFilter === owner ? 'active' : ''}`} onClick={() => setOwnerFilter(owner)}>{owner}</button>
                                      ))}
                                  </div>
                                  <label className="pro-toggle">
                                      <input type="checkbox" checked={showPro} onChange={(e) => setShowPro(e.target.checked)} />
                                      Inclure le Pro
                                  </label>
                              </div>

                              <div className="card">
                                  <div className="ap-label">Patrimoine net</div>
                                  <div className="total-amount">{totalNet.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</div>
                                  <HistoryChart history={filteredHistory} color={isOliwia ? '#E07A5F' : '#C5A059'} />
                                  <div className="time-filters">
                                      {['1J', '7J', '1M', '3M', '6M', 'YTD', '1A', 'TOUT'].map(range => (
                                          <button key={range} className={`time-btn ${timeRange === range ? 'active' : ''}`} onClick={() => setTimeRange(range)}>{range}</button>
                                      ))}
                                  </div>
                                  <div className="actifs-passifs">
                                      <div className="ap-item">
                                          <span className="ap-label">Actifs</span>
                                          <span className="ap-value">+{totalActifs.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>
                                      </div>
                                      <div className="ap-item" style={{alignItems: 'flex-end'}}>
                                          <span className="ap-label">Passifs</span>
                                          <span className="ap-value negative">{totalPassifs.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>
                                      </div>
                                  </div>
                              </div>

                              <div className="card">
                                  <div className="ap-label" style={{marginBottom: '15px'}}>Allocation d'Actifs</div>
                                  <div className="allocation-container">
                                      <DonutChart sortedData={sortedChartData} colors={chartColors} />
                                      <div className="legend-custom">
                                          {sortedChartData.map(([name, value], i) => {
                                              const total = sortedChartData.reduce((a, b) => a + b[1], 0);
                                              const pct = ((value / total) * 100).toFixed(1);
                                              return (
                                                  <div key={name} className="legend-item">
                                                      <span className="legend-name"><span className="legend-color" style={{background: chartColors[i % chartColors.length]}}></span>{name}</span>
                                                      <span className="legend-percent">{pct}%</span>
                                                  </div>
                                              )
                                          })}
                                      </div>
                                  </div>
                              </div>

                              <div className="card">
                                  <div className="ap-label" style={{marginBottom: '10px'}}>Détail des enveloppes</div>
                                  {sortedEnvelopes.map(([name, data]) => (
                                      <div key={name} className="envelope-item">
                                          <div className="envelope-header" onClick={() => setExpandedEnv(expandedEnv === name ? null : name)}>
                                              <span className="envelope-title">
                                                  <span className={`envelope-icon ${expandedEnv === name ? 'open' : ''}`}>▶</span> 
                                                  {name}
                                              </span>
                                              <span className="envelope-value">{data.total.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>
                                          </div>
                                          <div className={`envelope-details ${expandedEnv === name ? 'open' : ''}`}>
                                              {data.accounts.map(acc => (
                                                  <div key={acc.id} className="account-row">
                                                      <span>{acc.account_name} {acc.category && acc.category !== 'Livrets' && acc.category !== 'Dettes Conso' && acc.category !== 'Immobilier Brut' && acc.category !== 'Dette Immobilière' ? `(${acc.category})` : ''}</span>
                                                      <span>{acc.value_eur.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span>
                                                  </div>
                                              ))}
                                          </div>
                                      </div>
                                  ))}
                              </div>
                          </div>
                      ) : (
                          <div className="card" style={{textAlign: 'center', padding: '40px 20px'}}>
                              <p style={{color: 'var(--red)', marginBottom: '10px', fontWeight: 'bold'}}>Erreur de chargement</p>
                              <p style={{color: 'var(--text-light)', fontSize: '0.85rem'}}>{error || "La base de données Supabase est vide."}</p>
                          </div>
                      )
                  ) : (
                      <div>
                          <button onClick={() => setShowAddForm(!showAddForm)} className="btn-sync" style={{borderColor: 'var(--text-light)', color: 'var(--text-light)', marginBottom: '15px'}}>
                              {showAddForm ? "Fermer le formulaire" : "+ Ajouter un nouveau compte"}
                          </button>

                          {showAddForm && (
                              <form onSubmit={handleAddAccount} className="add-form open">
                                  <div className="add-form-grid">
                                      <select className="add-input" value={newAccount.owner} onChange={e => setNewAccount({...newAccount, owner: e.target.value})}>
                                          <option value="Aubin">Aubin</option>
                                          <option value="Oliwia">Oliwia</option>
                                      </select>
                                      <input className="add-input" placeholder="Enveloppe (ex: PEA)" required value={newAccount.envelope} onChange={e => setNewAccount({...newAccount, envelope: e.target.value})} />
                                  </div>
                                  <div className="add-form-grid">
                                      <input className="add-input" placeholder="Nom du compte" required value={newAccount.account_name} onChange={e => setNewAccount({...newAccount, account_name: e.target.value})} />
                                      <input className="add-input" placeholder="Catégorie (ex: Actions)" required value={newAccount.category} onChange={e => setNewAccount({...newAccount, category: e.target.value})} />
                                  </div>
                                  <div className="add-form-grid">
                                      <input className="add-input" type="number" step="any" placeholder="Valeur (€)" required value={newAccount.value_eur} onChange={e => setNewAccount({...newAccount, value_eur: e.target.value})} />
                                      <div style={{display: 'flex', alignItems: 'center', gap: '10px', fontSize: '0.8rem'}}>
                                          <label><input type="checkbox" checked={newAccount.is_liability} onChange={e => setNewAccount({...newAccount, is_liability: e.target.checked})}/> Dette</label>
                                          <label><input type="checkbox" checked={newAccount.is_professional} onChange={e => setNewAccount({...newAccount, is_professional: e.target.checked})}/> Pro</label>
                                      </div>
                                  </div>
                                  <button type="submit" className="btn-gold" style={{marginTop: '10px'}}>Ajouter ce compte</button>
                              </form>
                          )}

                          <button type="button" onClick={syncYahooPEA} disabled={syncLoading} className="btn-sync">
                              {syncLoading ? "⏳ Connexion à Yahoo..." : "⟳ Actualiser le PEA via Yahoo"}
                          </button>
                          
                          <button type="button" onClick={exportToCSV} className="btn-export">
                              📥 Exporter en CSV
                          </button>

                          <form onSubmit={handleSave}>
                              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px'}}>
                                  <p style={{fontSize: '0.85rem', color: 'var(--text-light)'}}>Mets à jour tes valeurs.</p>
                              </div>

                              {positions.map(p => (
                                  <div key={p.id} className="input-group">
                                      <div className="input-label">
                                          <p>{p.account_name}</p>
                                          <p>{p.owner} • {p.category}</p>
                                      </div>
                                      <div style={{display: 'flex', alignItems: 'center'}}>
                                          <input type="number" step="any" value={formValues[p.id] ?? ''} onChange={e => setFormValues(prev => ({...prev, [p.id]: e.target.value}))} className="input-field" />
                                          <button type="button" onClick={() => handleDeleteAccount(p)} className="btn-delete" title="Supprimer">🗑️</button>
                                      </div>
                                  </div>
                              ))}
                              
                              {positions.length > 0 && (
                                  <button type="submit" disabled={loading} className="btn-gold" style={{marginTop: '20px'}}>
                                      {loading ? "Enregistrement..." : "Enregistrer la mise à jour"}
                                  </button>
                              )}
                          </form>
                      </div>
                  )}
              </main>

              <nav className="bottom-nav">
                  <button onClick={() => setView('dashboard')} className={`nav-item ${view === 'dashboard' ? 'active' : ''}`}>
                      <span className="nav-icon">📊</span>
                      <span className="nav-text">Tableau de bord</span>
                  </button>
                  <button onClick={() => setView('saisie')} className={`nav-item ${view === 'saisie' ? 'active' : ''}`}>
                      <span className="nav-icon">✏️</span>
                      <span className="nav-text">Mise à jour</span>
                  </button>
              </nav>
          </div>
      );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
