const HistoryChart = memo(({ history, color, hideBalances }) => {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!chartRef.current || !history || history.length === 0) return;
    const ctx = chartRef.current.getContext('2d');
    const existing = Chart.getChart(ctx.canvas);
    if (existing) existing.destroy();
    const labels = history.map(h => new Date(h.snapshot_date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }));
    const dataPoints = history.map(h => Number(h.total_net));
    const gradient = ctx.createLinearGradient(0, 0, 0, 180);
    gradient.addColorStop(0, color + '44');
    gradient.addColorStop(1, color + '00');
    const instance = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ data: dataPoints, borderColor: color, borderWidth: 2, backgroundColor: gradient, fill: true, tension: 0.3, pointRadius: history.length === 1 ? 4 : 0, pointHoverRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, animation: { duration: 800, easing: 'easeOutQuart' }, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false }, tooltip: { enabled: !hideBalances, callbacks: { label: (ctx) => ctx.parsed.y.toLocaleString('fr-FR') + ' €' } } }, scales: { x: { display: false }, y: { display: false } } } });
    return () => instance.destroy();
  }, [history, color, hideBalances]);
  return <div className="history-chart-container"><canvas ref={chartRef}></canvas></div>;
});

const DonutChart = memo(({ sortedData, customColors, isOliwia, isAubin }) => {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!chartRef.current || sortedData.length === 0) return;
    const ctx = chartRef.current.getContext('2d');
    const existing = Chart.getChart(ctx.canvas);
    if (existing) existing.destroy();

    const defaultPalette = isOliwia 
      ? ['#D08C7A', '#E5B299', '#B5838D', '#D4A373', '#CC978E', '#E6CCB2', '#9C6644', '#DDBEA9'] 
      : isAubin

        : ['#E9C46A', '#2A9D8F', '#E76F51', '#264653', '#F4A261', '#8AB17D', '#457B9D', '#D4A373'];

    const finalColors = sortedData.map((d, i) => customColors[d[0]] || defaultPalette[i % defaultPalette.length]);

    const instance = new Chart(ctx, { type: 'doughnut', data: { labels: sortedData.map(d => d[0]), datasets: [{ data: sortedData.map(d => d[1]), backgroundColor: finalColors, borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '80%', animation: { animateScale: true, animateRotate: true }, plugins: { legend: { display: false }, tooltip: { enabled: false } } } });

  async function fetchFxRates() {
    const nextRates = { EUR: 1, PLN: null, USD: null };
    try {
      const { data, error } = await supabase.from('forex_rates').select('*').order('date', { ascending: false }).limit(1).single();
      if (!error && data) {
        if (data.eur_pln) nextRates.PLN = Number(data.eur_pln);
        if (data.eur_usd) nextRates.USD = Number(data.eur_usd);
      }
    } catch (_) {}

    if (!nextRates.PLN || !nextRates.USD) {
      try {
        const res = await fetch('https://api.frankfurter.app/latest?from=EUR&to=PLN,USD');
        const json = await res.json();
        if (json && json.rates) {
          if (!nextRates.PLN && json.rates.PLN) nextRates.PLN = Number(json.rates.PLN);
          if (!nextRates.USD && json.rates.USD) nextRates.USD = Number(json.rates.USD);
        }
      } catch (_) {}
    }
    setFxRates(nextRates);
    return nextRates;
  }

  async function syncFxValues() {
    setFxSyncLoading(true);
    const latestRates = await fetchFxRates();
    const fxPositions = positions.filter(p => p.currency && p.currency !== 'EUR' && p.native_amount !== null && p.native_amount !== undefined);
    if (fxPositions.length === 0) {
      setFxSyncLoading(false);
      return alert("Aucun compte en devise étrangère (PLN / USD) n'est configuré.");
    }

    const today = new Date().toISOString().split('T')[0];
    const updates = [];
    const updatedIds = [];

    fxPositions.forEach(p => {
      const newEur = toEur(Number(p.native_amount), p.currency, latestRates);
      updatedIds.push(p.id);
      updates.push({
        date: today,
        owner: p.owner,
        envelope: p.envelope,
        account_name: p.account_name,
        category: p.category || '',
        currency: p.currency,
        native_amount: Number(p.native_amount),
        value_eur: newEur,
        is_liability: p.is_liability,
        is_professional: p.is_professional || false,
        ticker: p.ticker || null,
        quantity: p.quantity ? Number(p.quantity) : null
      });
    });

    const { error } = await supabase.from('positions').upsert(updates, { onConflict: 'date,owner,envelope,account_name,category' });
    if (error) {
      alert('Erreur synchronisation FX : ' + error.message);
    } else {
      setDirtyValues(prev => { const next = { ...prev }; updatedIds.forEach(id => delete next[id]); return next; });
      setDirtyCurrency(prev => { const next = { ...prev }; updatedIds.forEach(id => delete next[id]); return next; });
      await fetchPositions();
      await fetchHistory();
      await fetchLogs();
      alert(`✅ ${updates.length} ligne(s) en devise recalculée(s) aux derniers taux (EUR/PLN: ${latestRates.PLN || 'N/A'}, EUR/USD: ${latestRates.USD || 'N/A'}).`);
    }
    setFxSyncLoading(false);
  }

  async function fetchPositions() {
    setLoading(true);
    const { data, error } = await supabase.from('latest_positions').select('*');
    if (error) setError('Erreur de chargement : ' + error.message);
    else if (data) {
      setPositions(data);
      setDirtyValues(prev => {
        const next = { ...prev };
        let changed = false;
        Object.keys(next).forEach(id => {
          const pos = data.find(p => p.id === id);
          const baseNative = pos ? (pos.native_amount ?? pos.value_eur) : null;
          if (!pos || Number(next[id]) === Number(baseNative)) {
            delete next[id];
            changed = true;
          }
        });
        return changed ? next : prev;
      });
    }
    setLoading(false);
  }

  async function fetchLogs() {
    const { data, error } = await supabase
      .from('positions')
      .select('created_at, date, owner, envelope, account_name, category, currency, native_amount, value_eur')
      .order('date', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(300);

    if (!error && data) {
      const byAccount = {};
      data.forEach(row => {
        const key = `${row.owner}|${row.envelope}|${row.account_name}|${row.category || ''}`;
        if (!byAccount[key]) byAccount[key] = [];
        byAccount[key].push(row);
      });

      const enriched = [];
      Object.values(byAccount).forEach(rows => {
        rows.forEach((row, idx) => {
          const prevRow = rows[idx + 1];
          const diff = prevRow !== undefined ? Number(row.value_eur) - Number(prevRow.value_eur) : null;
          enriched.push({ ...row, diff });
        });
      });

      enriched.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return (b.created_at || '').localeCompare(a.created_at || '');
      });

      const grouped = {};
      enriched.forEach(d => {
        if (!grouped[d.date]) grouped[d.date] = [];
        grouped[d.date].push(d);
      });
      setLogs(grouped);
    }
  }

  function handleImportCSV(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const text = e.target.result;
        const lines = text.split('\n').filter(l => l.trim() !== '');
        if (lines.length < 2) throw new Error("Le fichier CSV est vide ou invalide.");
        
        const today = new Date().toISOString().split('T')[0];
        const updates = [];
        
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i];
            const separator = line.includes(';') ? ';' : ',';
            const cols = line.split(separator).map(c => c.trim());
            
            if (cols.length >= 5) {
                const owner = cols[0];
                const envelope = cols[1];
                const account_name = cols[2];
                const category = cols[3];
                const rawAmount = parseFloat(cols[4].replace(',', '.'));
                const ccy = cols[5] && SUPPORTED_CURRENCIES.includes(cols[5].toUpperCase()) ? cols[5].toUpperCase() : 'EUR';
                
                if ((owner === 'Aubin' || owner === 'Oliwia') && !isNaN(rawAmount)) {
                    updates.push({
                        date: today, owner, envelope, account_name, category,
                        currency: ccy,
                        native_amount: rawAmount,
                        value_eur: toEur(rawAmount, ccy, fxRates),
                        is_liability: false, is_professional: false
                    });
                }
            }
        }
        
        if (updates.length === 0) throw new Error("Aucune ligne valide trouvée. Format attendu : Propriétaire,Enveloppe,Nom du compte,Catégorie,Montant[,Devise]");
        
        if (!window.confirm(`Importer ${updates.length} lignes depuis le CSV ?`)) return;
        
        setLoading(true);
        const { error } = await supabase.from('positions').upsert(updates, { onConflict: 'date,owner,envelope,account_name,category' });
        
        if (error) alert('Erreur Supabase : ' + error.message);
        else {
            alert(`✅ ${updates.length} comptes importés avec succès !`);
            fetchPositions(); fetchHistory(); fetchLogs();
        }
      } catch (err) { alert('Erreur de lecture CSV : ' + err.message); }
      setLoading(false);
      event.target.value = null;
    };
    reader.readAsText(file);
  }

  async function fetchTickersPrices(tickers) {
    let prices = {};
    let mode = 'supabase-edge';
    const endpoint = SUPABASE_URL + '/functions/v1/yahoo-quotes-?tickers=' + encodeURIComponent(tickers.join(',')) + '&t=' + Date.now();
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    
    try {
      const response = await fetch(endpoint, { method: 'GET', signal: controller.signal });
      clearTimeout(timeoutId);
      if (response.ok) {
        const data = await response.json();
        prices = data.prices || {};
      }
    } catch (edgeErr) {}

    if (Object.keys(prices).length === 0) {
      mode = 'client-fallback';
      const fetchWithTimeout = async (url, timeoutMs) => {
        const ctrl = new AbortController(); const id = setTimeout(() => ctrl.abort(), timeoutMs);
        try { return await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(id); }
      };
      const fetchTicker = async (ticker) => {
        const yahooUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ticker) + '?interval=1d&range=5d';
        const proxies = [
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(yahooUrl),
          'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(yahooUrl)
        ];
        for (const proxy of proxies) {
          try {
            const res = await fetchWithTimeout(proxy, 8000);
            if (!res.ok) continue;
            const data = await res.json();
            const meta = data?.chart?.result?.[0]?.meta;
            const price = meta?.regularMarketPrice ?? meta?.chartPreviousClose ?? meta?.previousClose;
            if (typeof price === 'number' && price > 0) return price;
          } catch (_) {}
        }
        return null;
      };
      await Promise.all(tickers.map(async t => {
        const p = await fetchTicker(t);
        if (p) prices[t] = p;
      }));
    }
    return { prices, mode };
  }

  async function syncYahooAll() {
    const etfPositions = positions.filter(p => p.ticker && p.ticker.trim() !== '');
    if (etfPositions.length === 0) {
      return alert("Aucun ticker configuré. Renseignez un ticker et un nombre de parts puis enregistrez.");
    }
    const tickers = [...new Set(etfPositions.map(p => p.ticker.trim()))];
    setSyncLoading(true);
    
    const { prices, mode } = await fetchTickersPrices(tickers);

    if (Object.keys(prices).length === 0) {
      alert("Erreur : Impossible de récupérer les cours depuis Yahoo Finance.");
      setSyncLoading(false);
      return;
    }

    let updatedCount = 0;
    let details = "";
    const newPositions = [...positions];
    const today = new Date().toISOString().split('T')[0];
    const updates = [];
    const syncedIds = [];

    etfPositions.forEach(p => {
      const price = prices[p.ticker.trim()];
      if (price && p.quantity) {
        const ccy = getEffectiveCurrency(p);
        const newNative = Math.round(p.quantity * price * 100) / 100;
        const newEur = toEur(newNative, ccy, fxRates);
        updatedCount++;
        syncedIds.push(p.id);
        details += `- ${p.account_name} (${p.ticker}): ${price.toFixed(2)} ${ccy}\n`;
        
        const posIndex = newPositions.findIndex(np => np.id === p.id);
        if (posIndex > -1) {
          newPositions[posIndex].native_amount = newNative;
          newPositions[posIndex].value_eur = newEur;
          newPositions[posIndex].currency = ccy;
        }

        updates.push({ 
          date: today, owner: p.owner, envelope: p.envelope, account_name: p.account_name, 
          category: p.category, currency: ccy, native_amount: newNative, value_eur: newEur,
          is_liability: p.is_liability, is_professional: p.is_professional,
          ticker: p.ticker.trim(), quantity: Number(p.quantity) 
        });
      }
    });

    setPositions(newPositions);
    setDirtyValues(prev => { const next = { ...prev }; syncedIds.forEach(id => delete next[id]); return next; });
    setDirtyCurrency(prev => { const next = { ...prev }; syncedIds.forEach(id => delete next[id]); return next; });
    setDirtyMeta(prev => { const next = { ...prev }; syncedIds.forEach(id => delete next[id]); return next; });

    if (updates.length > 0) {
      await supabase.from('positions').upsert(updates, { onConflict: 'date,owner,envelope,account_name,category' });
      fetchHistory();
      fetchLogs();
    }

    setSyncLoading(false);
    
    if (updatedCount > 0) {
      alert(`✅ ${updatedCount} lignes mises à jour et sauvegardées (${mode}) !\n\n${details}`);
    } else {
      alert("Aucun cours trouvé pour ces tickers.");
    }
  }

  const filteredPositions = positions.filter(p => {
    const matchOwner = ownerFilter === 'Tous' || p.owner === ownerFilter;
    const matchPro = showPro || !p.is_professional;
    return matchOwner && matchPro;
  });
  const totalActifs = filteredPositions.filter(p => p.value_eur > 0).reduce((sum, p) => sum + p.value_eur, 0);
  const totalPassifs = filteredPositions.filter(p => p.value_eur < 0).reduce((sum, p) => sum + p.value_eur, 0);
  const totalNet = totalActifs + totalPassifs;

  // Analyse unifiée Nominale vs Économique (Look-Through)
  const economicAnalysis = useMemo(() => {
    const chartMap = {};
    const ccyMap = {};
    const matrix = {};
    const envelopes = new Set();

    filteredPositions.forEach(p => {
      const ticker = (p.ticker || '').trim().toUpperCase();
      const lt = viewMode === 'economic' && ticker ? lookthroughMap[ticker] : null;
      const hasAssetLt = lt && lt.asset_allocation && Object.keys(lt.asset_allocation).length > 0;
      const hasCcyLt = lt && lt.currency_exposure && Object.keys(lt.currency_exposure).length > 0;

      // 1. Ventilation Classes d'Actifs & Matrice d'Exposition
      if (hasAssetLt && p.value_eur > 0) {
        envelopes.add(p.envelope);
        Object.entries(lt.asset_allocation).forEach(([catKey, pctVal]) => {
          const slice = p.value_eur * (Number(pctVal) / 100);
          chartMap[catKey] = (chartMap[catKey] || 0) + slice;
          if (!matrix[catKey]) matrix[catKey] = {};
          matrix[catKey][p.envelope] = (matrix[catKey][p.envelope] || 0) + slice;
        });
      } else {
        let cat = p.category;
        if (cat === 'Immobilier Brut') cat = 'Immobilier';
        if (cat === 'Dette Immobilière') {
          chartMap['Immobilier'] = (chartMap['Immobilier'] || 0) + p.value_eur;
        } else if (p.value_eur > 0 || cat === 'Immobilier') {
          chartMap[cat] = (chartMap[cat] || 0) + p.value_eur;
        }

        if (cat && cat !== 'Dette Immobilière' && cat !== 'Dettes Conso') {
          envelopes.add(p.envelope);
          if (!matrix[cat]) matrix[cat] = {};
          matrix[cat][p.envelope] = (matrix[cat][p.envelope] || 0) + p.value_eur;
        }
      }

      // 2. Ventilation Devises (sur les actifs bruts positifs)
      if (p.value_eur > 0) {
        if (hasCcyLt) {
          Object.entries(lt.currency_exposure).forEach(([ccyKey, pctVal]) => {
            const slice = p.value_eur * (Number(pctVal) / 100);
            ccyMap[ccyKey] = (ccyMap[ccyKey] || 0) + slice;
          });
        } else {
          const holdingCcy = p.currency || 'EUR';
          ccyMap[holdingCcy] = (ccyMap[holdingCcy] || 0) + p.value_eur;
        }
      }
    });

    const sortedCategories = Object.entries(chartMap)
      .filter(([, v]) => v > 0)
      .sort((a, b) => b[1] - a[1]);

    const totalEconomicAssets = sortedCategories.reduce((sum, [, v]) => sum + v, 0);
    const leverageRatio = totalActifs > 0 ? totalEconomicAssets / totalActifs : 1;

    const sortedCurrencies = Object.entries(ccyMap)
      .filter(([, v]) => v > 0)
      .sort((a, b) => b[1] - a[1]);
    const totalCcyExposure = sortedCurrencies.reduce((sum, [, v]) => sum + v, 0);

    const activeEnvelopes = Array.from(envelopes).sort();
    const activeCategories = TARGET_CATEGORIES.filter(cat => matrix[cat] && Object.values(matrix[cat]).some(v => v > 0));
    const rowTotals = {};
    activeCategories.forEach(cat => {
      rowTotals[cat] = Object.values(matrix[cat]).reduce((sum, v) => sum + v, 0);
    });

    return {
      sortedCategories,
      totalEconomicAssets,
      leverageRatio,
      sortedCurrencies,
      totalCcyExposure,
      matrix,
      activeEnvelopes,
      activeCategories,
      rowTotals
    };
  }, [filteredPositions, viewMode, lookthroughMap, totalActifs]);

  const sortedChartData = economicAnalysis.sortedCategories;
  const exposureMatrix = economicAnalysis;

  // Calcul rendement nominal et volatilité pondérés par l'allocation affichée
  const portfolioAssumptions = useMemo(() => {
    const positiveEntries = sortedChartData.filter(([, val]) => val > 0);
    const totalPos = positiveEntries.reduce((sum, [, val]) => sum + val, 0);
    if (totalPos <= 0) return { expectedReturn: 7.0, volatility: 15.0 };

    const weights = positiveEntries.map(([cat, val]) => {
      const assumption = CATEGORY_ASSUMPTIONS[cat] || CATEGORY_ASSUMPTIONS['Autre'];
      return { cat, w: val / totalPos, ret: assumption.ret, vol: assumption.vol };
    });

    const expRet = weights.reduce((sum, item) => sum + item.w * item.ret, 0);

    let variance = 0;
    for (let i = 0; i < weights.length; i++) {
      for (let j = 0; j < weights.length; j++) {
        const a = weights[i];
        const b = weights[j];
        let rho = 0;
        if (i === j) rho = 1.0;
        else if (a.vol > 0.01 && b.vol > 0.01) rho = 0.25;
        variance += a.w * b.w * a.vol * b.vol * rho;
      }
    }

    return {
      expectedReturn: Number((expRet * 100).toFixed(1)),
      volatility: Number((Math.sqrt(variance) * 100).toFixed(1))
    };
  }, [sortedChartData]);

  // Simulation Monte-Carlo avancée (40 ans)
  const fireSimulation = useMemo(() => {
    const years = 40;
    const simulations = 500;
    const mu = fireRendement / 100;
    const sigma = fireVolatilite / 100;
    const infl = fireInflation / 100;
    const swr = fireSwr / 100;

    const monthlyDrift = (mu - 0.5 * sigma * sigma) / 12;
    const monthlyVol = sigma / Math.sqrt(12);
    const monthlyInfl = Math.pow(1 + infl, 1 / 12);

    const fireTargetConstant = swr > 0 ? (Number(fireDepense) * 12) / swr : 0;
    const realReturnAnnual = ((1 + mu) / (1 + infl)) - 1;

    const seriesResults = Array(years + 1).fill(0).map(() => []);
    const fireReachedYears = [];
    const coastFireYears = [];
    let survivedCount = 0;

    for (let s = 0; s < simulations; s++) {
      let currentNominal = totalNet;
      let inflFactor = 1.0;
      let fireReached = currentNominal >= fireTargetConstant;
      let fireYear = fireReached ? 0 : null;

      const coastFactor0 = Math.pow(Math.max(0.01, 1 + realReturnAnnual), 30);
      let coastYear = (currentNominal * coastFactor0 >= fireTargetConstant) ? 0 : null;

      seriesResults[0].push(currentNominal);

      for (let year = 1; year <= years; year++) {
        for (let month = 1; month <= 12; month++) {
          inflFactor *= monthlyInfl;
          const u1 = Math.max(1e-12, Math.random());
          const u2 = Math.random();
          const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
          const growth = Math.exp(monthlyDrift + monthlyVol * z);

          const currentReal = currentNominal / inflFactor;
          if (!fireReached && currentReal >= fireTargetConstant) {
            fireReached = true;
            fireYear = year;
          }

          if (fireReached) {
            currentNominal = Math.max(0, currentNominal * growth - Number(fireDepense) * inflFactor);
          } else {
            currentNominal = currentNominal * growth + Number(fireEpargne) * inflFactor;
          }
        }

        const realEndOfYear = currentNominal / inflFactor;
        if (!fireReached && realEndOfYear >= fireTargetConstant) {
          fireReached = true;
          fireYear = year;
        }
        if (coastYear === null) {
          const remainingCoastYears = Math.max(0, 30 - year);
          const coastProjected = realEndOfYear * Math.pow(Math.max(0.01, 1 + realReturnAnnual), remainingCoastYears);
          if (coastProjected >= fireTargetConstant) {
            coastYear = year;
          }
        }

        seriesResults[year].push(fireRealTerms ? realEndOfYear : currentNominal);
      }

      if (currentNominal > 0) survivedCount++;
      fireReachedYears.push(fireYear !== null ? fireYear : 999);
      coastFireYears.push(coastYear !== null ? coastYear : 999);
    }

    const percentiles = seriesResults.map((sims, year) => {
      sims.sort((a, b) => a - b);
      return {
        year,
        p10: sims[Math.floor(sims.length * 0.10)],
        p50: sims[Math.floor(sims.length * 0.50)],
        p90: sims[Math.floor(sims.length * 0.90)]
      };
    });

    const targetLine = percentiles.map(d =>
      fireRealTerms ? fireTargetConstant : fireTargetConstant * Math.pow(1 + infl, d.year)
    );

    fireReachedYears.sort((a, b) => a - b);
    coastFireYears.sort((a, b) => a - b);
    const medianFireYear = fireReachedYears[Math.floor(simulations * 0.50)];
    const medianCoastYear = coastFireYears[Math.floor(simulations * 0.50)];

    return {
      percentiles,
      targetLine,
      fireTargetConstant,
      medianFireYear: medianFireYear <= years ? medianFireYear : null,
      medianCoastYear: medianCoastYear <= years ? medianCoastYear : null,
      survivalRate: (survivedCount / simulations) * 100
    };
  }, [totalNet, fireEpargne, fireRendement, fireVolatilite, fireInflation, fireDepense, fireSwr, fireRealTerms]);

  const filteredHistory = useMemo(() => {
    if (!historyData || !historyData.length) return [];
    const now = new Date();
    const cutoff = new Date();
    switch (timeRange) {
      case '7J': cutoff.setDate(now.getDate() - 7); break;
      case '1M': cutoff.setMonth(now.getMonth() - 1); break;
      case '3M': cutoff.setMonth(now.getMonth() - 3); break;
      case '6M': cutoff.setMonth(now.getMonth() - 6); break;
      case 'YTD': cutoff.setMonth(0, 1); cutoff.setHours(0,0,0,0); break;
      case '1A': cutoff.setFullYear(now.getFullYear() - 1); break;
      case 'TOUT': default: return historyData;
    }
    const cutoffStr = cutoff.toISOString().split('T')[0];
    const result = historyData.filter(d => d.snapshot_date >= cutoffStr);
    return result.length >= 2 ? result : historyData.slice(-2);

  const performance = useMemo(() => {

    const first = Number(filteredHistory[0].total_net);
    const last = Number(filteredHistory[filteredHistory.length - 1].total_net);

  const totalCategorized = sortedChartData.reduce((sum, d) => sum + d[1], 0);
  const actualPctData = {};
  sortedChartData.forEach(d => { if (TARGET_CATEGORIES.includes(d[0])) { actualPctData[d[0]] = totalCategorized > 0 ? (d[1] / totalCategorized) * 100 : 0; } });
  const targetPctData = {};
  TARGET_CATEGORIES.forEach(cat => { targetPctData[cat] = Number(targets[cat] || 0); });
  const currentTargetTotal = Object.values(tempTargets).reduce((sum, val) => sum + Number(val || 0), 0);

  const rebalanceData = useMemo(() => {
    if (!showRebalance) return [];
    let amountLeft = Number(rebalanceAmount);
    const result = [];
    const newTotal = totalCategorized + amountLeft;
    
    const gaps = TARGET_CATEGORIES.map(cat => {
      const currentVal = sortedChartData.find(d => d[0] === cat)?.[1] || 0;
      const targetPct = Number(targets[cat] || 0) / 100;
      const targetValue = newTotal * targetPct;
      return { cat, gap: targetValue - currentVal };
    });

    const deficits = gaps.filter(g => g.gap > 0).sort((a, b) => b.gap - a.gap);

    if (deficits.length === 0) {
        TARGET_CATEGORIES.forEach(cat => {
            const pct = Number(targets[cat] || 0) / 100;
            result.push({ cat, amount: amountLeft * pct });
        });
        return result.filter(r => r.amount > 0.5);
    }

    deficits.forEach(d => {
        if (amountLeft <= 0) return;
        const amountToAdd = Math.min(amountLeft, d.gap);
        result.push({ cat: d.cat, amount: amountToAdd });
        amountLeft -= amountToAdd;
    });

    if (amountLeft > 0) {
        const totalTargetPct = TARGET_CATEGORIES.reduce((sum, cat) => sum + Number(targets[cat] || 0), 0);
        if (totalTargetPct > 0) {
            TARGET_CATEGORIES.forEach(cat => {
                const pct = Number(targets[cat] || 0) / totalTargetPct;
                const extraAmount = amountLeft * pct;
                const existing = result.find(r => r.cat === cat);
                if (existing) existing.amount += extraAmount;
                else result.push({ cat, amount: extraAmount });
            });
        }
    }

    return result.filter(r => r.amount > 0.5).sort((a,b) => b.amount - a.amount);

                                          <div className="input-wrapper">
                                            <button type="button" className="quick-btn" onClick={() => quickAdd(p.id, -1000)} disabled={hideBalances}>-</button>
                                            <input type="number" step="any" value={hideBalances ? '••••' : getRawNativeVal(p)} onChange={e => handleInputChange(p.id, e.target.value)} className={'table-input ' + (isDirty ? 'dirty' : '')} readOnly={hideBalances} />
                                            <select className="ccy-select" value={effCcy} onChange={e => handleCurrencyChange(p, e.target.value)} disabled={hideBalances}>
                                              {SUPPORTED_CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                            <button type="button" className="quick-btn" onClick={() => quickAdd(p.id, 1000)} disabled={hideBalances}>+</button>
                                            <button type="button" onClick={() => handleDeleteAccount(p)} className="btn-delete" title="Supprimer" disabled={hideBalances}><Icon name="trash" size={15} /></button>
                                          </div>
                                          {effCcy !== 'EUR' && (
                                            <div style={{fontSize: '0.68rem', color: 'var(--text-light)', marginTop: '3px', paddingRight: '26px'}}>
                                              ≈ {formatMoney(effEur)}
                                            </div>
                                          )}
                                        </td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                              <button type="button" onClick={() => handleAddEtf(envName, baseContractName, positionsList[0].owner)} style={{marginTop: '10px', background: 'none', border: '1px dashed var(--gold)', color: 'var(--gold)', padding: '8px', borderRadius: '8px', width: '100%', fontSize: '0.8rem', cursor: 'pointer'}}>+ Ajouter une ligne (Ticker)</button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
              {positions.length > 0 && (<button type="submit" disabled={loading || hideBalances} className="btn-gold" style={{marginTop: '10px', marginBottom: '25px'}}>{loading ? 'Enregistrement...' : `Enregistrer les modifications${pendingModificationsCount > 0 ? ` (${pendingModificationsCount})` : ''}`}</button>)}
            </form>

            {/* Gestionnaire Look-Through (Transparence ETF / Fonds) */}
            <div className="card animate-in delay-2" style={{marginBottom: '20px'}}>
              <div className="ap-label" style={{marginBottom: '8px'}}>Transparence des actifs (Look-Through)</div>
              <p style={{fontSize: '0.78rem', color: 'var(--text-light)', marginBottom: '14px'}}>
                Définissez la répartition économique réelle (classes d'actifs et devises sous-jacentes) de vos tickers pour activer la <strong>Vue Économique</strong> sur le Dashboard.
              </p>

              {allKnownTickers.map(item => {
                const lt = lookthroughMap[item.ticker];
                const isConfigured = lt && (Object.keys(lt.asset_allocation || {}).length > 0 || Object.keys(lt.currency_exposure || {}).length > 0);
                return (
                  <div key={item.ticker} className="lt-ticker-row">
                    <div>
                      <div style={{fontWeight: '700', color: 'var(--gold)', fontSize: '0.85rem'}}>{item.ticker}</div>
                      <div style={{fontSize: '0.7rem', color: 'var(--text-light)'}}>
                        {isConfigured
                          ? Object.entries(lt.asset_allocation).map(([k, v]) => `${k} ${v}%`).join(' • ')
                          : item.label}
                      </div>
                    </div>
                    <div style={{display: 'flex', gap: '6px'}}>
                      <button type="button" className="btn-apply-alloc" onClick={() => openLookthroughEditor(item.ticker, item.label)}>
                        {isConfigured ? 'Modifier' : 'Configurer'}
                      </button>
                      {isConfigured && (
                        <button type="button" className="btn-delete" onClick={() => deleteLookthrough(item.ticker)} title="Supprimer">
                          <Icon name="trash" size={14} />
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}

              <div style={{display: 'flex', gap: '8px', marginTop: '12px'}}>
                <input
                  className="add-input"
                  style={{padding: '8px 10px', fontSize: '0.8rem'}}
                  placeholder="Ajouter un ticker (ex: NTSG.DE)"
                  value={newLtTickerInput}
                  onChange={e => setNewLtTickerInput(e.target.value.toUpperCase())}
                />
                <button
                  type="button"
                  className="btn-apply-alloc"
                  onClick={() => { if (newLtTickerInput.trim()) { openLookthroughEditor(newLtTickerInput.trim()); setNewLtTickerInput(''); } }}
                >
                  + Éditer
                </button>
              </div>

              {editingLtTicker && (
                <div className="lt-editor animate-in">
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px'}}>
                    <strong style={{color: 'var(--gold)', fontSize: '0.9rem'}}>Paramétrage : {editingLtTicker}</strong>
                    <button type="button" style={{background: 'none', border: 'none', color: 'var(--text-light)', cursor: 'pointer'}} onClick={() => setEditingLtTicker(null)}>✕</button>
                  </div>

                  <div style={{fontSize: '0.72rem', color: 'var(--text-light)', marginBottom: '4px'}}>Modèles rapides :</div>
                  <div className="preset-pills">
                    {LT_PRESETS.map(p => (
                      <button key={p.name} type="button" className="preset-pill" onClick={() => applyLtPreset(p)}>{p.name}</button>
                    ))}
                  </div>

                  <div style={{fontSize: '0.75rem', fontWeight: '600', color: 'var(--text-white)', marginTop: '12px'}}>1. Allocation par classe d'actifs (%)</div>
                  <div className="lt-kv-grid">
                    {TARGET_CATEGORIES.map(cat => (
                      <div key={cat} className="lt-kv-item">
                        <span style={{color: 'var(--text-light)'}}>{cat}</span>
                        <input
                          type="number"
                          step="any"
                          className="lt-pct-input"
                          placeholder="0"
                          value={ltDraft.asset[cat] !== undefined ? ltDraft.asset[cat] : ''}
                          onChange={e => setLtDraft(prev => ({ ...prev, asset: { ...prev.asset, [cat]: e.target.value } }))}
                        />
                      </div>
                    ))}
                  </div>

                  <div style={{fontSize: '0.75rem', fontWeight: '600', color: 'var(--text-white)', marginTop: '12px'}}>2. Exposition aux devises sous-jacentes (%)</div>
                  <div className="lt-kv-grid">
                    {LT_CURRENCIES.map(ccy => (
                      <div key={ccy} className="lt-kv-item">
                        <span style={{color: 'var(--text-light)'}}>{ccy}</span>
                        <input
                          type="number"
                          step="any"
                          className="lt-pct-input"
                          placeholder="0"
                          value={ltDraft.ccy[ccy] !== undefined ? ltDraft.ccy[ccy] : ''}
                          onChange={e => setLtDraft(prev => ({ ...prev, ccy: { ...prev.ccy, [ccy]: e.target.value } }))}
                        />
                      </div>
                    ))}
                  </div>

                  <button type="button" onClick={saveLookthrough} className="btn-gold" style={{marginTop: '14px', padding: '12px', fontSize: '0.88rem'}}>
                    Enregistrer la transparence ({editingLtTicker})
                  </button>
                </div>
              )}
            </div>

            {sortedChartData.length > 0 && (
              <div className="card animate-in delay-3">
                <div className="ap-label" style={{marginBottom: '15px'}}>Apparence des graphiques</div>
                <p style={{fontSize: '0.8rem', color: 'var(--text-light)', marginBottom: '15px'}}>
                  Personnalisation des couleurs des catégories pour le graphique en anneau (sauvegardée sur le compte).
                </p>
                {sortedChartData.map(d => {
                  const catName = d[0];
                  const defaultColor = '#888888';
                  return (
                    <div key={catName} className="color-picker-row">
                      <span style={{fontSize: '0.9rem', color: 'var(--text-white)'}}>{catName}</span>
                      <input 
                        type="color" 
                        className="color-input" 
                        value={customColors[catName] || defaultColor} 
                        onChange={(e) => updateCustomColor(catName, e.target.value)} 
                      />
                    </div>
                  );
                })}
                <button type="button" onClick={resetChartColors} className="btn-reset-colors">Réinitialiser les couleurs du thème</button>
              </div>
            )}
          </div>
        )}
        {view === 'projection' && (
          <div className="animate-in">
            <div className="card">
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px'}}>
                <div className="ap-label">Simulateur FIRE (Monte-Carlo)</div>
                <div style={{fontSize: '0.75rem', color: 'var(--gold)', fontWeight: '600'}}>Périmètre : {ownerFilter}{showPro ? ' + Pro' : ''}</div>
              </div>

              <div className="fire-alloc-banner">
                <div>
                  <div style={{fontSize: '0.72rem', color: 'var(--text-light)'}}>Profil de votre allocation ({viewMode === 'economic' ? 'Économique' : 'Nominale'})</div>
                  <div style={{fontSize: '0.85rem', fontWeight: '600', color: 'var(--text-white)', marginTop: '2px'}}>
                    Rendement : {portfolioAssumptions.expectedReturn} % • Volatilité : {portfolioAssumptions.volatility} %
                  </div>
                </div>
                <button
                  type="button"
                  className="btn-apply-alloc"
                  onClick={() => updateFireSettings({
                    rendement: portfolioAssumptions.expectedReturn,
                    volatilite: portfolioAssumptions.volatility
                  })}
                >
                  Appliquer
                </button>
              </div>

              <div className="segmented-toggle">
                <button
                  type="button"
                  className={'segmented-btn ' + (fireRealTerms ? 'active' : '')}
                  onClick={() => updateFireSettings({ realTerms: true })}
                >
                  Euros constants (pouvoir d'achat)
                </button>
                <button
                  type="button"
                  className={'segmented-btn ' + (!fireRealTerms ? 'active' : '')}
                  onClick={() => updateFireSettings({ realTerms: false })}
                >
                  Euros courants (nominaux)
                </button>
              </div>

              <div className="slider-container">
                <div className="slider-header"><span className="slider-label">Épargne mensuelle (avant FIRE)</span><span className="slider-value">{hideBalances ? '••••' : Number(fireEpargne).toLocaleString('fr-FR') + ' €'}</span></div>
                <input type="range" min="0" max="20000" step="100" value={fireEpargne} onChange={e => updateFireSettings({ epargne: Number(e.target.value) })} disabled={hideBalances} />
              </div>

              <div className="slider-container">
                <div className="slider-header"><span className="slider-label">Dépense mensuelle cible (rente)</span><span className="slider-value">{hideBalances ? '••••' : Number(fireDepense).toLocaleString('fr-FR') + ' €'}</span></div>
                <input type="range" min="1000" max="15000" step="100" value={fireDepense} onChange={e => updateFireSettings({ depense: Number(e.target.value) })} disabled={hideBalances} />
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px'}}>
                <div className="slider-container">
                  <div className="slider-header"><span className="slider-label">Rendement</span><span className="slider-value">{fireRendement} %</span></div>
                  <input type="range" min="1" max="15" step="0.1" value={fireRendement} onChange={e => updateFireSettings({ rendement: Number(e.target.value) })} disabled={hideBalances} />
                </div>
                <div className="slider-container">
                  <div className="slider-header"><span className="slider-label">Volatilité</span><span className="slider-value">{fireVolatilite} %</span></div>
                  <input type="range" min="1" max="25" step="0.5" value={fireVolatilite} onChange={e => updateFireSettings({ volatilite: Number(e.target.value) })} disabled={hideBalances} />
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px'}}>
                <div className="slider-container">
                  <div className="slider-header"><span className="slider-label">Inflation</span><span className="slider-value">{fireInflation} %</span></div>
                  <input type="range" min="0" max="6" step="0.2" value={fireInflation} onChange={e => updateFireSettings({ inflation: Number(e.target.value) })} disabled={hideBalances} />
                </div>
                <div className="slider-container">
                  <div className="slider-header"><span className="slider-label">Taux retrait (SWR)</span><span className="slider-value">{fireSwr} %</span></div>
                  <input type="range" min="2.5" max="5.0" step="0.1" value={fireSwr} onChange={e => updateFireSettings({ swr: Number(e.target.value) })} disabled={hideBalances} />
                </div>
              </div>

              <div className="fire-result" style={{marginTop: '4px', marginBottom: '16px'}}>
                <div className="fire-box">
                  <div className="fire-box-label">Capital cible FIRE (aujourd'hui)</div>
                  <div className="fire-box-value">{formatMoney(fireSimulation.fireTargetConstant)}</div>
                  <div className="fire-box-sub">Rente de {formatMoney(fireDepense)} / mois à {fireSwr}%</div>
                </div>
                <div className="fire-box">
                  <div className="fire-box-label">Atteinte FIRE (Médiane P50)</div>
                  <div className="fire-box-value" style={{color: fireSimulation.medianFireYear !== null ? 'var(--green)' : 'var(--gold)'}}>
                    {fireSimulation.medianFireYear === 0
                      ? 'Déjà atteint'
                      : fireSimulation.medianFireYear !== null
                        ? `${currentYear + fireSimulation.medianFireYear} (+${fireSimulation.medianFireYear} ans)`
                        : '> 40 ans'}
                  </div>
                  <div className="fire-box-sub">Arrêt épargne & début rente</div>
                </div>
                <div className="fire-box">
                  <div className="fire-box-label">Coast FIRE (horizon 30 ans)</div>
                  <div className="fire-box-value">
                    {fireSimulation.medianCoastYear === 0
                      ? 'Déjà atteint'
                      : fireSimulation.medianCoastYear !== null
                        ? `${currentYear + fireSimulation.medianCoastYear} (+${fireSimulation.medianCoastYear} ans)`
                        : '> 40 ans'}
                  </div>
                  <div className="fire-box-sub">Capital autonome sans ajout</div>
                </div>
                <div className="fire-box">
                  <div className="fire-box-label">Survie du capital à 40 ans</div>
                  <div className="fire-box-value" style={{color: fireSimulation.survivalRate >= 85 ? 'var(--green)' : fireSimulation.survivalRate >= 70 ? 'var(--gold)' : 'var(--red)'}}>
                    {fireSimulation.survivalRate.toFixed(1)} %
                  </div>
                  <div className="fire-box-sub">Sur 500 scénarios avec rente</div>
                </div>
              </div>
              
              <FireMonteCarloChart mcData={fireSimulation.percentiles} fireTargetLine={fireSimulation.targetLine} color={currentThemeColor} hideBalances={hideBalances} />

              <div style={{fontSize: '0.72rem', color: 'var(--text-light)', marginTop: '10px', textAlign: 'center'}}>
                * 500 trajectoires log-normales ({fireRealTerms ? 'euros constants' : 'euros courants'}). L'épargne bascule automatiquement en rente dès l'atteinte du seuil FIRE.
              </div>

              <div className="fire-result" style={{marginTop: '16px'}}>
                <div className="fire-box"><div className="fire-box-label">Dans 10 ans (Médian)</div><div className="fire-box-value">{formatMoney(fireSimulation.percentiles[10]?.p50 || 0)}</div></div>
                <div className="fire-box"><div className="fire-box-label">Dans 20 ans (Médian)</div><div className="fire-box-value">{formatMoney(fireSimulation.percentiles[20]?.p50 || 0)}</div></div>
                <div className="fire-box"><div className="fire-box-label">Pire scénario à 20 ans</div><div className="fire-box-value" style={{color: 'var(--red)'}}>{formatMoney(fireSimulation.percentiles[20]?.p10 || 0)}</div></div>
                <div className="fire-box"><div className="fire-box-label">Favorable à 20 ans</div><div className="fire-box-value" style={{color: 'var(--green)'}}>{formatMoney(fireSimulation.percentiles[20]?.p90 || 0)}</div></div>
              </div>
            </div>
          </div>
        )}
        {view === 'cible' && (
          <div className="animate-in">
            {editTargetsMode ? (
              <div className="card">
                <div className="ap-label" style={{marginBottom: '10px'}}>Définir les cibles (%)</div>
                <div className={'total-indicator ' + (Math.round(currentTargetTotal) === 100 ? 'ok' : 'not-ok')}>Total : {currentTargetTotal.toFixed(0)}% / 100%</div>
                {TARGET_CATEGORIES.map(cat => (
                  <div className="slider-container" key={cat}>
                    <div className="slider-header"><span className="slider-label">{cat}</span><span className="slider-value">{tempTargets[cat] || 0} %</span></div>
                    <input type="range" min="0" max="100" step="1" value={tempTargets[cat] || 0} onChange={e => handleTargetSliderChange(cat, e.target.value)} />
                  </div>
                ))}
                <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
                  <button onClick={() => { setEditTargetsMode(false); setTempTargets(targets); }} className="btn-export" style={{flex:1, marginBottom:0}}>Annuler</button>
                  <button onClick={saveTargets} className="btn-gold" style={{flex:2}} disabled={Math.round(currentTargetTotal) !== 100}>Enregistrer</button>
                </div>
              </div>
            ) : (
              <div>
                <div style={{display: 'flex', gap: '10px', marginBottom: '20px'}}>
                  <button onClick={() => setEditTargetsMode(true)} className="btn-sync" style={{flex:1, marginBottom:0}}>✏️ Modifier</button>
                  <button onClick={() => setShowRebalance(!showRebalance)} className="btn-gold" style={{flex:1}}>⚖️ Rééquilibrer</button>
                </div>
                {showRebalance && (
                  <div className="card" style={{border: '1px solid var(--gold)'}}>
                    <div className="ap-label" style={{marginBottom: '15px'}}>Plan d'investissement (Cash-Flow Only)</div>
                    <div className="slider-container">
                      <div className="slider-header"><span className="slider-label">Montant à investir</span><span className="slider-value">{formatMoney(rebalanceAmount)}</span></div>
                      <input type="range" min="0" max="50000" step="100" value={rebalanceAmount} onChange={e => setRebalanceAmount(e.target.value)} disabled={hideBalances} />
                    </div>
                    <div style={{background: 'var(--input-bg)', padding: '15px', borderRadius: '12px'}}>
                      <p style={{fontSize: '0.8rem', color: 'var(--text-light)', marginBottom: '10px'}}>Répartition recommandée sans cession d'actifs existants :</p>
                      {rebalanceData.map(item => (
                        <div key={item.cat} style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.9rem', marginBottom: '5px'}}>
                          <span>{item.cat}</span>
                          <span style={{color: 'var(--green)', fontWeight: 'bold'}}>+{formatMoney(item.amount)}</span>
                        </div>
                      ))}
                      {rebalanceData.length === 0 && <p style={{fontSize:'0.8rem', textAlign:'center'}}>L'allocation actuelle correspond déjà à la cible.</p>}
                    </div>
                  </div>
                )}
                <div className="card">
                  <div className="ap-label" style={{marginBottom: '20px'}}>Cible vs Réel</div>
                  {TARGET_CATEGORIES.map(cat => {
                    const actual = actualPctData[cat] || 0;
                    const target = targetPctData[cat] || 0;
                    return (
                      <div className="target-bar-container" key={cat}>
                        <div className="target-bar-label">
                          <span>{cat}</span>
                          <span style={{color: actual > target + 5 ? 'var(--gold)' : actual < target - 5 ? 'var(--red)' : 'var(--text-light)'}}>Réel: {actual.toFixed(1)}% / Cible: {target.toFixed(0)}%</span>
                        </div>
                        <div className="target-bar-bg">
                          <div className="target-bar-target" style={{width: target + '%'}}></div>
                          <div className="target-bar-actual" style={{width: actual + '%'}}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}
        {view === 'journal' && (
          <div className="card animate-in">
            <div className="ap-label" style={{marginBottom: '20px'}}>Journal & Historique</div>
            <p style={{fontSize: '0.8rem', color: 'var(--text-light)', marginBottom: '20px'}}>
              Détail des variations par compte et par date. Supprimez une date erronée pour recalculer le graphique.
            </p>
            {Object.keys(logs).length === 0 ? (
              <p style={{color: 'var(--text-light)', textAlign: 'center'}}>Aucune opération.</p>
            ) : (
              Object.entries(logs).map(pair => {
                const date = pair[0]; const items = pair[1];
                const dateObj = new Date(date);
                const formattedDate = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
                
                return (
                  <div key={date} style={{marginBottom: '20px', background: 'var(--input-bg)', padding: '15px', borderRadius: '12px'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px'}}>
                      <div style={{fontSize: '0.9rem', color: 'var(--gold)', fontWeight: 'bold', textTransform: 'capitalize'}}>{formattedDate}</div>
                      <button onClick={() => deleteHistoryDay(date)} className="btn-delete-history">Supprimer ce jour</button>
                    </div>
                    <div>
                      {items.map((item, idx) => (
                        <div key={idx} className="log-row">
                          <div style={{flex: 1}}>
                            <div style={{color: 'var(--text-white)', fontWeight: '500'}}>{item.account_name}</div>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-light)'}}>
                              {item.owner} • {item.envelope}{item.currency && item.currency !== 'EUR' ? ` (${Number(item.native_amount).toLocaleString('fr-FR')} ${item.currency})` : ''}
                            </div>
                          </div>
                          <div style={{textAlign: 'right'}}>
                            <div style={{fontWeight: '600', color: 'var(--text-white)'}}>{formatMoney(item.value_eur)}</div>
                            {item.diff !== null && (
                              <div style={{fontSize: '0.72rem', fontWeight: '600', color: item.diff > 0 ? 'var(--green)' : item.diff < 0 ? 'var(--red)' : 'var(--text-light)'}}>
                                {hideBalances ? '••••' : `${item.diff > 0 ? '+' : ''}${Math.round(item.diff).toLocaleString('fr-FR')} €`}
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        )}
      </main>
      <nav className="bottom-nav">
        <button onClick={() => setView('dashboard')} className={'nav-item ' + (view === 'dashboard' ? 'active' : '')}><Icon name="dashboard" size={20} /><span className="nav-text">Dashboard</span></button>
        <button onClick={() => setView('saisie')} className={'nav-item ' + (view === 'saisie' ? 'active' : '')}><Icon name="edit" size={20} /><span className="nav-text">Saisie</span></button>
        <button onClick={() => setView('cible')} className={'nav-item ' + (view === 'cible' ? 'active' : '')}><Icon name="target" size={20} /><span className="nav-text">Cible</span></button>
        <button onClick={() => setView('projection')} className={'nav-item ' + (view === 'projection' ? 'active' : '')}><Icon name="crystal" size={20} /><span className="nav-text">FIRE</span></button>
        <button onClick={() => setView('journal')} className={'nav-item ' + (view === 'journal' ? 'active' : '')}><Icon name="book" size={20} /><span className="nav-text">Journal</span></button>
      </nav>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (renderErr) {
  console.error('[RENDER ERROR]', renderErr);
  window.__showFatalError('Erreur de rendu React', renderErr.message + '\n\n' + (renderErr.stack || ''));
}

} catch (bootErr) {
  console.error('[BOOT ERROR]', bootErr);
  window.__showFatalError('Erreur au démarrage (JSX/Babel)', bootErr.message + '\n\n' + (bootErr.stack || ''));
}
</script>
</body>
</html>
