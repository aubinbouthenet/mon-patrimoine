  };
  return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name]}</svg>;
};

const HistoryChart = memo(({ history, color }) => {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!chartRef.current || !history || history.length === 0) return;
    const ctx = chartRef.current.getContext('2d');
    const existing = Chart.getChart(ctx.canvas);
    if (existing) existing.destroy();
    const labels = history.map(h => new Date(h.snapshot_date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }));
    const dataPoints = history.map(h => Number(h.total_net));
    const gradient = ctx.createLinearGradient(0, 0, 0, 180);
    gradient.addColorStop(0, color + '44');
    gradient.addColorStop(1, color + '00');
    new Chart(ctx, { type: 'line', data: { labels, datasets: [{ data: dataPoints, borderColor: color, borderWidth: 2, backgroundColor: gradient, fill: true, tension: 0.3, pointRadius: history.length === 1 ? 4 : 0, pointHoverRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, animation: { duration: 800, easing: 'easeOutQuart' }, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { label: (ctx) => ctx.parsed.y.toLocaleString('fr-FR') + ' €' } } }, scales: { x: { display: false }, y: { display: false } } } });
  }, [history, color]);
  return <div className="history-chart-container"><canvas ref={chartRef}></canvas></div>;
});

const DonutChart = memo(({ sortedData, colors }) => {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!chartRef.current || sortedData.length === 0) return;
    const ctx = chartRef.current.getContext('2d');
    const existing = Chart.getChart(ctx.canvas);
    if (existing) existing.destroy();
    new Chart(ctx, { type: 'doughnut', data: { labels: sortedData.map(d => d[0]), datasets: [{ data: sortedData.map(d => d[1]), backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '80%', animation: { animateScale: true, animateRotate: true }, plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
  }, [sortedData, colors]);
  return <div className="chart-donut"><canvas ref={chartRef}></canvas></div>;
});

const FireChart = memo(({ data, color }) => {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!chartRef.current || data.length === 0) return;
    const ctx = chartRef.current.getContext('2d');
    const existing = Chart.getChart(ctx.canvas);
    if (existing) existing.destroy();
    const labels = data.map(d => 'Année ' + d.year);
    const dataPoints = data.map(d => d.value);
    const gradient = ctx.createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, color + '44');
    gradient.addColorStop(1, color + '00');
    new Chart(ctx, { type: 'line', data: { labels, datasets: [{ data: dataPoints, borderColor: color, borderWidth: 3, backgroundColor: gradient, fill: true, tension: 0.4, pointRadius: 0, pointHoverRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, animation: { duration: 1000 }, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { label: (ctx) => Math.round(ctx.parsed.y).toLocaleString('fr-FR') + ' €' } } }, scales: { x: { display: false }, y: { display: false } } } });
  }, [data, color]);
  return <div className="history-chart-container" style={{height: '200px'}}><canvas ref={chartRef}></canvas></div>;
});

  async function fetchTickersPrices(tickers) {
    let prices = {};
    let mode = 'supabase-edge';
    const endpoint = SUPABASE_URL + '/functions/v1/yahoo-quotes-?tickers=' + encodeURIComponent(tickers.join(',')) + '&t=' + Date.now();
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    
    try {
      const response = await fetch(endpoint, { method: 'GET', signal: controller.signal });
      clearTimeout(timeoutId);
      if (response.ok) {
        const data = await response.json();
        prices = data.prices || {};
      }
    } catch (edgeErr) {}

    if (Object.keys(prices).length === 0) {
      mode = 'client-fallback';
      const fetchWithTimeout = async (url, timeoutMs) => {
        const ctrl = new AbortController(); const id = setTimeout(() => ctrl.abort(), timeoutMs);
        try { return await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(id); }
      };
      const fetchTicker = async (ticker) => {
        const yahooUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ticker) + '?interval=1d&range=5d';
        const proxies = [
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(yahooUrl),
          'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(yahooUrl)
        ];
        for (const proxy of proxies) {
          try {
            const res = await fetchWithTimeout(proxy, 8000);
            if (!res.ok) continue;
            const data = await res.json();
            const meta = data?.chart?.result?.[0]?.meta;
            const price = meta?.regularMarketPrice ?? meta?.chartPreviousClose ?? meta?.previousClose;
            if (typeof price === 'number' && price > 0) return price;
          } catch (_) {}
        }
        return null;
      };
      await Promise.all(tickers.map(async t => {
        const p = await fetchTicker(t);
        if (p) prices[t] = p;
      }));
    }
    return { prices, mode };
  }

  async function syncYahooAll() {
    const etfPositions = positions.filter(p => p.ticker && p.ticker.trim() !== '');

    }
    const tickers = [...new Set(etfPositions.map(p => p.ticker.trim()))];
    setSyncLoading(true);
    
    const { prices, mode } = await fetchTickersPrices(tickers);

    if (Object.keys(prices).length === 0) {
      alert("Erreur : Impossible de récupérer les cours depuis Yahoo Finance. Vérifie tes codes (ex: CW8.PA).");
      setSyncLoading(false);
      return;
    }

    let updatedCount = 0;
    let details = "";
    const newFormValues = { ...formValues };
    const newPositions = [...positions];
    const today = new Date().toISOString().split('T')[0];
    const updates = [];

    etfPositions.forEach(p => {
      const price = prices[p.ticker.trim()];
      if (price && p.quantity) {
        const newVal = Math.round(p.quantity * price);
        newFormValues[p.id] = newVal;
        updatedCount++;
        details += `- ${p.account_name} (${p.ticker}): ${price.toFixed(2)} €\n`;
        
        const posIndex = newPositions.findIndex(np => np.id === p.id);
        if(posIndex > -1) newPositions[posIndex].value_eur = newVal;

        updates.push({ 
          date: today, owner: p.owner, envelope: p.envelope, account_name: p.account_name, 
          category: p.category, value_eur: newVal, is_liability: p.is_liability, 
          is_professional: p.is_professional, ticker: p.ticker.trim(), quantity: Number(p.quantity) 
        });
      }
    });

    setFormValues(newFormValues);
    setPositions(newPositions);

    if (updates.length > 0) {
      await supabase.from('positions').upsert(updates, { onConflict: 'date,owner,envelope,account_name,category' });
    }

    setSyncLoading(false);
    
    if (updatedCount > 0) {
      alert(`✅ ${updatedCount} lignes mises à jour et sauvegardées (${mode}) !\n\n${details}`);
    } else {
      alert("Aucun cours trouvé pour tes tickers.");
    }
  }

      try {

  async function saveTargets() {
    if (Math.round(currentTargetTotal) !== 100) return alert('Le total doit être exactement de 100%.');
    setLoading(true);
    const updates = TARGET_CATEGORIES.map(cat => ({ category: cat, target_percentage: Number(tempTargets[cat] || 0) }));
    const { error } = await supabase.from('target_allocations').upsert(updates, { onConflict: 'category' });
    if (error) alert('Erreur : ' + error.message);
    else { setTargets(tempTargets); setEditTargetsMode(false); }
    setLoading(false);
  }
  function handleTargetSliderChange(cat, value) {
    const newValue = Number(value);
    const oldValue = Number(tempTargets[cat] || 0);
    const diff = newValue - oldValue;
    if (diff > 0 && currentTargetTotal + diff > 100) return;
    setTempTargets({...tempTargets, [cat]: newValue});
  }

  const filteredPositions = positions.filter(p => {
    const matchOwner = ownerFilter === 'Tous' || p.owner === ownerFilter;
    const matchPro = showPro || !p.is_professional;
    return matchOwner && matchPro;
  });
  const totalActifs = filteredPositions.filter(p => p.value_eur > 0).reduce((sum, p) => sum + p.value_eur, 0);
  const totalPassifs = filteredPositions.filter(p => p.value_eur < 0).reduce((sum, p) => sum + p.value_eur, 0);
  const totalNet = totalActifs + totalPassifs;

  const fireData = useMemo(() => {
    const data = [];
    let current = totalNet;
    const monthlyRate = (fireRendement / 100) / 12;
    for (let year = 0; year <= 30; year++) {
      if (year > 0) { for (let month = 1; month <= 12; month++) { current = current * (1 + monthlyRate) + Number(fireEpargne); } }
      data.push({ year, value: current });
    }
    return data;
  }, [totalNet, fireEpargne, fireRendement]);

  const filteredHistory = useMemo(() => {
    if (!historyData || !historyData.length) return [];
    const now = new Date();
    const cutoff = new Date();
    switch (timeRange) {
      case '7J': cutoff.setDate(now.getDate() - 7); break;
      case '1M': cutoff.setMonth(now.getMonth() - 1); break;
      case '3M': cutoff.setMonth(now.getMonth() - 3); break;
      case '6M': cutoff.setMonth(now.getMonth() - 6); break;
      case 'YTD': cutoff.setMonth(0, 1); cutoff.setHours(0,0,0,0); break;
      case '1A': cutoff.setFullYear(now.getFullYear() - 1); break;
      case 'TOUT': default: return historyData;
    }
    const cutoffStr = cutoff.toISOString().split('T')[0];
    const result = historyData.filter(d => d.snapshot_date >= cutoffStr);
    return result.length >= 2 ? result : historyData.slice(-2);
  }, [historyData, timeRange]);

  const performance = useMemo(() => {
    if (!filteredHistory || filteredHistory.length < 2) return { diff: 0, pct: 0 };
    const first = Number(filteredHistory[0].total_net);
    const last = Number(filteredHistory[filteredHistory.length - 1].total_net);
    const diff = last - first;
    const pct = first !== 0 ? (diff / first) * 100 : 0;
    return { diff, pct };
  }, [filteredHistory]);

  const sortedChartData = useMemo(() => {
    const chartData = {};
    filteredPositions.forEach(p => {
      let cat = p.category;
      if (cat === 'Immobilier Brut') cat = 'Immobilier';
      if (cat === 'Dette Immobilière') return;
      if (p.value_eur > 0 || cat === 'Immobilier') { chartData[cat] = (chartData[cat] || 0) + p.value_eur; }
    });
    const debtImmo = filteredPositions.filter(p => p.category === 'Dette Immobilière').reduce((sum, p) => sum + p.value_eur, 0);
    if (chartData['Immobilier']) chartData['Immobilier'] += debtImmo;
    return Object.entries(chartData).sort((a, b) => b[1] - a[1]);
  }, [filteredPositions]);

  const exposureMatrix = useMemo(() => {
    const matrix = {};
    filteredPositions.forEach(p => {
      let cat = p.category;
      if (cat === 'Immobilier Brut') cat = 'Immobilier';
      if (cat === 'Dette Immobilière') return;
      if (!cat || cat === 'Dettes Conso') return;
      if (!matrix[p.envelope]) matrix[p.envelope] = {};
      if (!matrix[p.envelope][cat]) matrix[p.envelope][cat] = 0;
      matrix[p.envelope][cat] += p.value_eur;
    });
    const activeCategories = TARGET_CATEGORIES.filter(cat => Object.values(matrix).some(env => env[cat] && env[cat] > 0));
    
    const colTotals = {};
    activeCategories.forEach(cat => {
      colTotals[cat] = Object.values(matrix).reduce((sum, env) => sum + (env[cat] || 0), 0);
    });

    return { matrix, activeCategories, colTotals };
  }, [filteredPositions]);

  const topHoldings = useMemo(() => {
    return [...filteredPositions].sort((a,b) => b.value_eur - a.value_eur).slice(0, 5);
  }, [filteredPositions]);

  const totalCategorized = sortedChartData.reduce((sum, d) => sum + d[1], 0);
  const actualPctData = {};
  sortedChartData.forEach(d => { if (TARGET_CATEGORIES.includes(d[0])) { actualPctData[d[0]] = totalCategorized > 0 ? (d[1] / totalCategorized) * 100 : 0; } });
  const targetPctData = {};
  TARGET_CATEGORIES.forEach(cat => { targetPctData[cat] = Number(targets[cat] || 0); });
  const currentTargetTotal = Object.values(tempTargets).reduce((sum, val) => sum + Number(val || 0), 0);
  const rebalanceData = useMemo(() => {
    if (!showRebalance) return [];
    const amount = Number(rebalanceAmount);
    const newTotal = totalCategorized + amount;
    const result = [];
    TARGET_CATEGORIES.forEach(cat => {
      const currentVal = sortedChartData.find(d => d[0] === cat)?.[1] || 0;
      const targetPct = Number(targets[cat] || 0) / 100;
      const targetValue = newTotal * targetPct;
      const diff = targetValue - currentVal;
      if (Math.abs(diff) > 1) result.push({ cat, diff });
    });
    return result.sort((a,b) => b.diff - a.diff);
  }, [showRebalance, rebalanceAmount, sortedChartData, targets, totalCategorized]);

  const isOliwia = ownerFilter === 'Oliwia';
  const isAubin = ownerFilter === 'Aubin';
  
  // PALETTES ÉTENDUES ET NUANCÉES
  const chartColors = isOliwia 
    ? ['#D08C7A', '#E5B299', '#B5838D', '#D4A373', '#CC978E', '#E6CCB2', '#9C6644', '#DDBEA9'] // Terre
    : isAubin 
      ? ['#84A98C', '#52796F', '#A3B18A', '#CAD2C5', '#588157', '#C2A884', '#3A5A40', '#8E9A76'] // Forêt
      : ['#D4A373', '#E5B299', '#CC978E', '#9C6644', '#DDBEA9', '#B5838D', '#FAEDCD', '#F4A261']; // Sable

  const currentThemeColor = isOliwia ? '#D08C7A' : (isAubin ? '#84A98C' : '#D4A373');

  const groupedForSaisie = {};
  filteredPositions.forEach(p => {
    const baseName = p.account_name.split(' - ')[0];
    if (!groupedForSaisie[p.envelope]) groupedForSaisie[p.envelope] = {};
    if (!groupedForSaisie[p.envelope][baseName]) groupedForSaisie[p.envelope][baseName] = [];
    groupedForSaisie[p.envelope][baseName].push(p);
  });
  
  const sortedSaisieEnvelopes = Object.entries(groupedForSaisie).sort((a, b) => {
    const totalA = Object.values(a[1]).flat().reduce((sum, p) => sum + p.value_eur, 0);
    const totalB = Object.values(b[1]).flat().reduce((sum, p) => sum + p.value_eur, 0);
    return totalB - totalA;
  });

  if (!session) {
    return (
      <div className="login-screen animate-in">
        <form onSubmit={handleLogin} className="login-card">
          <h1 className="serif">Patrimoine</h1><p>Private Wealth</p>
          {error && <p className="error-msg">{error}</p>}
          <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="login-input" />
          <button type="submit" disabled={loading} className="btn-gold">{loading ? 'Connexion...' : 'Accéder au portefeuille'}</button>
        </form>
      </div>
    );
  }

  return (
    <div className="app-container">
      <header className="header animate-in">
        <h2 className="serif">Mon Patrimoine</h2>
        <div className="header-actions">
          <button onClick={() => setIsDarkMode(!isDarkMode)} className="btn-theme" title="Changer de thème"><Icon name={isDarkMode ? 'sun' : 'moon'} size={20} /></button>
          <button onClick={handleLogout} className="btn-logout">Déconnexion</button>
        </div>
      </header>
      <main>
        {view === 'dashboard' && (
          positions.length > 0 ? (
            <div>
              <div className="filters-container animate-in delay-1">
                <div className="owner-filter">{['Tous', 'Aubin', 'Oliwia'].map(owner => (<button key={owner} className={'owner-btn ' + (ownerFilter === owner ? 'active' : '')} onClick={() => setOwnerFilter(owner)}>{owner}</button>))}</div>
                <label className="pro-toggle"><input type="checkbox" checked={showPro} onChange={(e) => setShowPro(e.target.checked)} />Inclure le Pro</label>
              </div>
              
              <div className="card animate-in delay-2">
                <div className="ap-label">Patrimoine net</div>
                <div style={{display: 'flex', alignItems: 'baseline', flexWrap: 'wrap'}}>
                  <div className="total-amount">{totalNet.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</div>
                  {filteredHistory.length >= 2 && (
                    <div className={`perf-badge ${performance.diff >= 0 ? 'pos' : 'neg'}`}>
                      {performance.diff >= 0 ? '↗' : '↘'} {performance.pct >= 0 ? '+' : ''}{performance.pct.toFixed(1)}%
                    </div>
                  )}
                </div>
                <HistoryChart history={filteredHistory} color={currentThemeColor} />
                <div className="time-filters">{['1J', '7J', '1M', '3M', '6M', 'YTD', '1A', 'TOUT'].map(range => (<button key={range} className={'time-btn ' + (timeRange === range ? 'active' : '')} onClick={() => setTimeRange(range)}>{range}</button>))}</div>
                <div className="actifs-passifs">
                  <div className="ap-item"><span className="ap-label">Actifs</span><span className="ap-value">+{totalActifs.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span></div>
                  <div className="ap-item" style={{alignItems: 'flex-end'}}><span className="ap-label">Passifs</span><span className="ap-value negative">{totalPassifs.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}</span></div>
                </div>
              </div>

              <div className="card animate-in delay-2">
                <div className="ap-label" style={{marginBottom: '10px'}}>Top 5 des positions</div>
                <div className="top-list">
                  {topHoldings.map((p, index) => (
                    <div key={p.id} className="top-item">
                      <div style={{display: 'flex', alignItems: 'center'}}>
                        <div className="top-rank">{index + 1}</div>
                        <div>
                          <div style={{fontWeight: '500'}}>{p.account_name}</div>
                          <div style={{fontSize: '0.7rem', color: 'var(--text-light)'}}>{p.envelope}</div>
                        </div>
                      </div>
                      <div style={{fontWeight: 'bold', color: 'var(--gold)'}}>
                        {p.value_eur.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="card animate-in delay-2">
                <div className="ap-label" style={{marginBottom: '15px'}}>Allocation par Catégorie</div>
                <div className="allocation-container">
                  <DonutChart sortedData={sortedChartData} colors={chartColors} />
                  <div className="legend-custom">
                    {sortedChartData.map((entry, i) => {
                      const name = entry[0]; const value = entry[1];
                      const total = sortedChartData.reduce((a, b) => a + b[1], 0);
                      const pct = total > 0 ? ((value / total) * 100).toFixed(1) : '0.0';
                      return (<div key={name} className="legend-item"><span className="legend-name"><span className="legend-color" style={{background: chartColors[i % chartColors.length]}}></span>{name}</span><span className="legend-percent">{pct}%</span></div>);
                    })}
                  </div>
                </div>
              </div>

              <div className="card animate-in delay-3">
                <div className="ap-label" style={{marginBottom: '10px'}}>Matrice d'Exposition</div>
                <div style={{overflowX: 'auto'}}>
                  <table className="matrix-table">
                    <thead><tr><th>Enveloppe</th>{exposureMatrix.activeCategories.map(cat => (<th key={cat}>{cat}</th>))}</tr></thead>
                    <tbody>
                      {Object.entries(exposureMatrix.matrix).sort((a,b) => {
                        const totA = Object.values(a[1]).reduce((s,v)=>s+v,0);
                        const totB = Object.values(b[1]).reduce((s,v)=>s+v,0);
                        return totB - totA;
                      }).map(pair => {
                        const env = pair[0]; const cats = pair[1];
                        return (<tr key={env}><td>{env}</td>{exposureMatrix.activeCategories.map(cat => (<td key={cat}>{cats[cat] ? Math.round(cats[cat]).toLocaleString('fr-FR') : '-'}</td>))}</tr>);
                      })}
                    </tbody>
                    <tfoot>
                      <tr style={{borderTop: '2px solid var(--gold)'}}>
                        <td style={{fontWeight: 'bold', color: 'var(--gold)'}}>TOTAL</td>
                        {exposureMatrix.activeCategories.map(cat => (
                          <td key={cat} style={{fontWeight: 'bold', color: 'var(--text-white)'}}>
                            {Math.round(exposureMatrix.colTotals[cat]).toLocaleString('fr-FR')}
                          </td>
                        ))}
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            </div>
          ) : (
            <div className="card" style={{textAlign: 'center', padding: '40px 20px'}}>
              <p style={{color: 'var(--red)', marginBottom: '10px', fontWeight: 'bold'}}>Erreur de chargement</p>
              <p style={{color: 'var(--text-light)', fontSize: '0.85rem'}}>{error || 'La base de données Supabase est vide.'}</p>
            </div>
          )
        )}
        
        {view === 'saisie' && (
          <div className="animate-in">
            <div style={{display: 'flex', gap: '10px', marginBottom: '15px'}}>
              <button type="button" onClick={syncYahooAll} disabled={syncLoading} className="btn-sync" style={{flex:1, marginBottom:0}}><Icon name="refresh" size={16} /> {syncLoading ? 'Sync...' : 'Sync Tout'}</button>
              <button type="button" onClick={exportToJSON} className="btn-export" style={{flex:1, marginBottom:0}}><Icon name="download" size={16} /> Sauvegarde</button>
              <label className="btn-export" style={{flex:1, marginBottom:0, cursor: 'pointer'}}><Icon name="upload" size={16} /> Restaurer<input type="file" accept=".json" onChange={importFromJSON} style={{display: 'none'}} /></label>
            </div>
            {plnRate && (<p style={{fontSize: '0.8rem', color: 'var(--text-light)', textAlign: 'center', marginBottom: '15px'}}>Taux de change actuel : 1 EUR = {plnRate} PLN</p>)}
            
            <button onClick={() => setShowAddForm(!showAddForm)} className="btn-sync" style={{borderColor: 'var(--text-light)', color: 'var(--text-light)', marginBottom: '15px'}}>{showAddForm ? 'Fermer le formulaire' : '+ Ajouter un nouveau compte'}</button>
            {showAddForm && (
              <form onSubmit={handleAddAccount} className="add-form open">
                <div className="add-form-grid">
                  <select className="add-input" value={newAccount.owner} onChange={e => setNewAccount({...newAccount, owner: e.target.value})}><option value="Aubin">Aubin</option><option value="Oliwia">Oliwia</option></select>
                  <select className="add-input" required value={newAccount.envelope} onChange={e => setNewAccount({...newAccount, envelope: e.target.value})}>{ENVELOPPES_LIST.map(env => <option key={env} value={env}>{env}</option>)}</select>
                </div>
                <div className="add-form-grid">
                  <input className="add-input" placeholder="Nom du compte" required value={newAccount.account_name} onChange={e => setNewAccount({...newAccount, account_name: e.target.value})} />
                  <select className="add-input" required value={newAccount.category} onChange={e => setNewAccount({...newAccount, category: e.target.value})}>{CATEGORIES_LIST.map(cat => <option key={cat} value={cat}>{cat}</option>)}</select>
                </div>
                <div className="add-form-grid">
                  <input className="add-input" type="number" step="any" placeholder="Valeur (€)" required value={newAccount.value_eur} onChange={e => setNewAccount({...newAccount, value_eur: e.target.value})} />
                  <div style={{display: 'flex', alignItems: 'center', gap: '10px', fontSize: '0.8rem'}}>
                    <label><input type="checkbox" checked={newAccount.is_liability} onChange={e => setNewAccount({...newAccount, is_liability: e.target.checked})}/> Dette</label>
                    <label><input type="checkbox" checked={newAccount.is_professional} onChange={e => setNewAccount({...newAccount, is_professional: e.target.checked})}/> Pro</label>
                  </div>
                </div>
                <button type="submit" className="btn-gold" style={{marginTop: '10px'}}>Ajouter ce compte</button>
              </form>
            )}

            <form onSubmit={handleSave}>
              <p style={{fontSize: '0.85rem', color: 'var(--text-light)', marginBottom: '20px'}}>Clique sur une enveloppe pour la déplier et modifier tes valeurs.</p>
              
              {sortedSaisieEnvelopes.map(pair => {
                const envName = pair[0]; 
                const contractsObj = pair[1];
                const envTotal = Object.values(contractsObj).flat().reduce((sum, p) => sum + (Number(formValues[p.id]) || 0), 0);
                const isExpanded = expandedSaisieEnv === envName;

                return (
                  <div className="card" key={envName} style={{padding: '20px', marginBottom: '15px'}}>
                    <div 
                      className="update-header" 
                      onClick={() => setExpandedSaisieEnv(isExpanded ? null : envName)} 
                      style={{cursor: 'pointer', marginBottom: isExpanded ? '15px' : '0', borderBottom: isExpanded ? '1px solid var(--border-color)' : 'none', paddingBottom: isExpanded ? '10px' : '0'}}
                    >
                      <h3 className="serif" style={{fontSize: '1.2rem', color: 'var(--text-white)', display: 'flex', alignItems: 'center', gap: '10px'}}>
                        <span style={{fontSize: '0.8rem', transform: isExpanded ? 'rotate(90deg)' : 'rotate(0deg)', transition: 'transform 0.2s', color: 'var(--gold)'}}>▶</span> 
                        {envName}
                      </h3>
                      <div style={{fontSize: '0.9rem', fontWeight: 'bold', color: 'var(--gold)'}}>{Math.round(envTotal).toLocaleString('fr-FR')} €</div>
                    </div>
                    
                    {isExpanded && (
                      <div className="animate-in">
                        {Object.entries(contractsObj).map(contractPair => {
                          const baseContractName = contractPair[0];
                          const positionsList = contractPair[1];
                          const contractTotal = positionsList.reduce((sum, p) => sum + (Number(formValues[p.id]) || 0), 0);
                          const isPolishAccount = baseContractName.includes('PKO') || baseContractName.includes('mBank');
                          const displayValue = isPolishAccount && plnRate ? Math.round(contractTotal * plnRate) : Math.round(contractTotal);
                          return (
                            <div key={baseContractName} style={{marginTop: '10px'}}>
                              <div className="contract-header">
                                <span className="contract-title">{baseContractName} {isPolishAccount && <span style={{fontSize:'0.7rem', color:'var(--text-light)'}}>(en PLN)</span>}</span>
                                {positionsList.length > 1 && (<div className="total-input-container"><span>Total :</span><input type="number" className="total-input" value={displayValue} onChange={(e) => { const newVal = Number(e.target.value); const valInEuro = isPolishAccount && plnRate ? newVal / plnRate : newVal; handleContractTotalChange(baseContractName, positionsList, valInEuro); }} /></div>)}
                              </div>
                              <table className="update-table">
                                <thead><tr><th>Support</th><th>ETF / Ticker</th><th style={{textAlign: 'right'}}>Valeur (€)</th></tr></thead>
                                <tbody>
                                  {positionsList.map(p => {
                                    const rowName = p.account_name.includes(' - ')
                                      ? p.account_name.split(' - ')[1]
                                      : (p.category || 'Général');

                                    return (
                                      <tr key={p.id}>
                                        <td style={{color: 'var(--gold)'}}>
                                          {rowName}
                                          <div style={{fontSize: '0.65rem', color: 'var(--text-light)'}}>{p.owner} • {p.category}</div>
                                        </td>
                                        <td style={{textAlign: 'right'}}>
                                          <div className="etf-row">
                                            <input className="small-input" placeholder="Ticker" value={p.ticker || ''} onChange={e => updatePositionEtf(p.id, 'ticker', e.target.value.toUpperCase())} title="Code Yahoo (ex: CW8.PA)" />
                                            <input className="small-input" type="number" step="any" placeholder="Parts" value={p.quantity || ''} onChange={e => updatePositionEtf(p.id, 'quantity', e.target.value)} title="Nombre de parts" />
                                            <button type="button" className="btn-sync-single" onClick={() => syncSingleEtf(p)} disabled={syncingId === p.id} title="Synchroniser et sauvegarder">
                                              <Icon name="refresh" size={14} />
                                            </button>
                                          </div>
                                        </td>
                                        <td style={{textAlign: 'right'}}>
                                          <div className="input-wrapper">
                                            <button type="button" className="quick-btn" onClick={() => quickAdd(p.id, -1000)}>-</button>
                                            <input type="number" step="any" value={formValues[p.id] ?? ''} onChange={e => setFormValues(prev => ({...prev, [p.id]: e.target.value}))} className="table-input" />
                                            <button type="button" className="quick-btn" onClick={() => quickAdd(p.id, 1000)}>+</button>
                                            <button type="button" onClick={() => handleDeleteAccount(p)} className="btn-delete" title="Supprimer"><Icon name="trash" size={16} /></button>
                                          </div>
                                        </td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                              <button type="button" onClick={() => handleAddEtf(envName, baseContractName, positionsList[0].owner)} style={{marginTop: '10px', background: 'none', border: '1px dashed var(--gold)', color: 'var(--gold)', padding: '8px', borderRadius: '8px', width: '100%', fontSize: '0.8rem', cursor: 'pointer'}}>+ Ajouter une ligne (Ticker)</button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
              {positions.length > 0 && (<button type="submit" disabled={loading} className="btn-gold" style={{marginTop: '10px', marginBottom: '30px'}}>{loading ? 'Enregistrement...' : 'Enregistrer les modifications'}</button>)}
            </form>
          </div>
        )}
        {view === 'projection' && (
          <div className="animate-in">
            <div className="card">
              <div className="ap-label" style={{marginBottom: '20px'}}>Simulateur FIRE</div>
              <div className="slider-container">
                <div className="slider-header"><span className="slider-label">Épargne mensuelle</span><span className="slider-value">{Number(fireEpargne).toLocaleString('fr-FR')} €</span></div>
                <input type="range" min="0" max="20000" step="100" value={fireEpargne} onChange={e => setFireEpargne(e.target.value)} />
              </div>
              <div className="slider-container">
                <div className="slider-header"><span className="slider-label">Rendement annuel estimé</span><span className="slider-value">{fireRendement} %</span></div>
                <input type="range" min="1" max="15" step="0.5" value={fireRendement} onChange={e => setFireRendement(e.target.value)} />
              </div>
              <FireChart data={fireData} color={currentThemeColor} />
              <div className="fire-result">
                <div className="fire-box"><div className="fire-box-label">Dans 5 ans</div><div className="fire-box-value">{Math.round(fireData[5].value).toLocaleString('fr-FR')} €</div></div>
                <div className="fire-box"><div className="fire-box-label">Dans 10 ans</div><div className="fire-box-value">{Math.round(fireData[10].value).toLocaleString('fr-FR')} €</div></div>
                <div className="fire-box"><div className="fire-box-label">Dans 20 ans</div><div className="fire-box-value">{Math.round(fireData[20].value).toLocaleString('fr-FR')} €</div></div>
                <div className="fire-box"><div className="fire-box-label">Dans 30 ans</div><div className="fire-box-value">{Math.round(fireData[30].value).toLocaleString('fr-FR')} €</div></div>
              </div>
            </div>
          </div>
        )}
        {view === 'cible' && (
          <div className="animate-in">
            {editTargetsMode ? (
              <div className="card">
                <div className="ap-label" style={{marginBottom: '10px'}}>Définir mes cibles (%)</div>
                <div className={'total-indicator ' + (Math.round(currentTargetTotal) === 100 ? 'ok' : 'not-ok')}>Total : {currentTargetTotal.toFixed(0)}% / 100%</div>
                {TARGET_CATEGORIES.map(cat => (
                  <div className="slider-container" key={cat}>
                    <div className="slider-header"><span className="slider-label">{cat}</span><span className="slider-value">{tempTargets[cat] || 0} %</span></div>
                    <input type="range" min="0" max="100" step="1" value={tempTargets[cat] || 0} onChange={e => handleTargetSliderChange(cat, e.target.value)} />
                  </div>
                ))}
                <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
                  <button onClick={() => { setEditTargetsMode(false); setTempTargets(targets); }} className="btn-export" style={{flex:1, marginBottom:0}}>Annuler</button>
                  <button onClick={saveTargets} className="btn-gold" style={{flex:2}} disabled={Math.round(currentTargetTotal) !== 100}>Enregistrer</button>
                </div>
              </div>
            ) : (
              <div>
                <div style={{display: 'flex', gap: '10px', marginBottom: '20px'}}>
                  <button onClick={() => setEditTargetsMode(true)} className="btn-sync" style={{flex:1, marginBottom:0}}>✏️ Modifier</button>
                  <button onClick={() => setShowRebalance(!showRebalance)} className="btn-gold" style={{flex:1}}>⚖️ Rééquilibrer</button>
                </div>
                {showRebalance && (
                  <div className="card" style={{border: '1px solid var(--gold)'}}>
                    <div className="ap-label" style={{marginBottom: '15px'}}>Plan d'investissement</div>
                    <div className="slider-container">
                      <div className="slider-header"><span className="slider-label">Montant à investir</span><span className="slider-value">{Number(rebalanceAmount).toLocaleString('fr-FR')} €</span></div>
                      <input type="range" min="0" max="50000" step="100" value={rebalanceAmount} onChange={e => setRebalanceAmount(e.target.value)} />
                    </div>
                    <div style={{background: 'var(--input-bg)', padding: '15px', borderRadius: '12px'}}>
                      <p style={{fontSize: '0.8rem', color: 'var(--text-light)', marginBottom: '10px'}}>Pour respecter ta cible, voici comment répartir cet argent :</p>
                      {rebalanceData.map(item => (
                        <div key={item.cat} style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.9rem', marginBottom: '5px'}}>
                          <span>{item.cat}</span>
                          <span style={{color: item.diff > 0 ? 'var(--green)' : 'var(--red)', fontWeight: 'bold'}}>{item.diff > 0 ? '+' : ''}{Math.round(item.diff).toLocaleString('fr-FR')} €</span>
                        </div>
                      ))}
                      {rebalanceData.length === 0 && <p style={{fontSize:'0.8rem', textAlign:'center'}}>Ton allocation est déjà parfaite !</p>}
                    </div>
                  </div>
                )}
                <div className="card">
                  <div className="ap-label" style={{marginBottom: '20px'}}>Cible vs Réel</div>
                  {TARGET_CATEGORIES.map(cat => {
                    const actual = actualPctData[cat] || 0;
                    const target = targetPctData[cat] || 0;
                    return (
                      <div className="target-bar-container" key={cat}>
                        <div className="target-bar-label">
                          <span>{cat}</span>
                          <span style={{color: actual > target + 5 ? 'var(--gold)' : actual < target - 5 ? 'var(--red)' : 'var(--text-light)'}}>Réel: {actual.toFixed(1)}% / Cible: {target.toFixed(0)}%</span>
                        </div>
                        <div className="target-bar-bg">
                          <div className="target-bar-target" style={{width: target + '%'}}></div>
                          <div className="target-bar-actual" style={{width: actual + '%'}}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}
        {view === 'journal' && (
          <div className="card animate-in">
            <div className="ap-label" style={{marginBottom: '20px'}}>Journal & Historique</div>
            <p style={{fontSize: '0.8rem', color: 'var(--text-light)', marginBottom: '20px'}}>
              Supprime une date pour corriger le graphique si tu as fait une erreur (ex: suppression d'un compte).
            </p>
            {Object.keys(logs).length === 0 ? (
              <p style={{color: 'var(--text-light)', textAlign: 'center'}}>Aucune opération.</p>
            ) : (
              Object.entries(logs).map(pair => {
                const date = pair[0]; const items = pair[1];
                const dateObj = new Date(date);
                const formattedDate = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
                
                return (
                  <div key={date} style={{marginBottom: '20px', background: 'var(--input-bg)', padding: '15px', borderRadius: '12px'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px'}}>
                      <div style={{fontSize: '0.9rem', color: 'var(--gold)', fontWeight: 'bold', textTransform: 'capitalize'}}>{formattedDate}</div>
                      <button onClick={() => deleteHistoryDay(date)} className="btn-delete-history">Supprimer ce jour</button>
                    </div>
                    <div style={{fontSize: '0.75rem', color: 'var(--text-light)'}}>
                      {items.length} modification(s) enregistrée(s) ce jour.
                    </div>
                  </div>
                );
              })
            )}
          </div>
        )}
      </main>
      <nav className="bottom-nav">
        <button onClick={() => setView('dashboard')} className={'nav-item ' + (view === 'dashboard' ? 'active' : '')}><Icon name="dashboard" size={20} /><span className="nav-text">Dashboard</span></button>
        <button onClick={() => setView('saisie')} className={'nav-item ' + (view === 'saisie' ? 'active' : '')}><Icon name="edit" size={20} /><span className="nav-text">Saisie</span></button>
        <button onClick={() => setView('cible')} className={'nav-item ' + (view === 'cible' ? 'active' : '')}><Icon name="target" size={20} /><span className="nav-text">Cible</span></button>
        <button onClick={() => setView('projection')} className={'nav-item ' + (view === 'projection' ? 'active' : '')}><Icon name="crystal" size={20} /><span className="nav-text">FIRE</span></button>
        <button onClick={() => setView('journal')} className={'nav-item ' + (view === 'journal' ? 'active' : '')}><Icon name="book" size={20} /><span className="nav-text">Journal</span></button>
      </nav>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (renderErr) {
  console.error('[RENDER ERROR]', renderErr);
  window.__showFatalError('Erreur de rendu React', renderErr.message + '\n\n' + (renderErr.stack || ''));
}

} catch (bootErr) {
  console.error('[BOOT ERROR]', bootErr);
  window.__showFatalError('Erreur au démarrage (JSX/Babel)', bootErr.message + '\n\n' + (bootErr.stack || ''));
}
</script>
</body>
</html>
